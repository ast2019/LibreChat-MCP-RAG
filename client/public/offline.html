<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light dark" />
    <title>HiveGPT — آفلاین</title>
    <!-- Served by the service worker for a navigation that fails with no network. The page is
         returned under whatever URL was requested, so it cannot rely on relative asset paths:
         the logo is inline and the font is loaded from the worker's scope. -->
    <style>
      :root {
        --bg: #f7f7f8;
        --fg: #0d0d0d;
        --muted: #595959;
        --brand: #2563eb;
        --brand-strong: #1d4ed8;
        --on-brand: #ffffff;
        --ring: #0d0d0d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171717;
          --fg: #ececec;
          --muted: #b4b4b4;
          --ring: #ececec;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Vazirmatn', Tahoma, system-ui, sans-serif;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
        text-align: center;
      }
      svg {
        width: 4.5rem;
        height: 4.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.8;
        color: var(--muted);
      }
      button {
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        background: var(--brand-strong);
      }
      button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient
            id="hive-blue"
            x1="96"
            y1="40"
            x2="416"
            y2="472"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0" stop-color="#60A5FA" />
            <stop offset="0.55" stop-color="#2563EB" />
            <stop offset="1" stop-color="#1E3A8A" />
          </linearGradient>
          <linearGradient
            id="hive-spark"
            x1="188"
            y1="172"
            x2="324"
            y2="316"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0" stop-color="#3B82F6" />
            <stop offset="1" stop-color="#1D4ED8" />
          </linearGradient>
        </defs>
        <polygon
          points="256,44 439.6,150 439.6,362 256,468 72.4,362 72.4,150"
          fill="url(#hive-blue)"
          stroke="url(#hive-blue)"
          stroke-width="56"
          stroke-linejoin="round"
        />
        <path
          d="M196 148h120c39.8 0 72 32.2 72 72v48c0 39.8-32.2 72-72 72h-76l-62 46c-7.9 5.9-19 0.2-19-9.6v-44.6c-22.6-12.4-35-35.6-35-63.8v-48c0-39.8 32.2-72 72-72z"
          fill="#FFFFFF"
        />
        <path
          d="M256 168c7 42 24 68 72 76c-48 8-65 34-72 76c-7-42-24-68-72-76c48-8 65-34 72-76z"
          fill="url(#hive-spark)"
        />
      </svg>
      <h1>اتصال به اینترنت برقرار نیست</h1>
      <p>
        HiveGPT برای پاسخ‌دادن به اینترنت نیاز دارد. اتصال را بررسی کنید و دوباره تلاش کنید؛ با
        برگشتن اتصال، صفحه خودش باز می‌شود.
      </p>
      <button type="button" id="retry">تلاش دوباره</button>
    </main>
    <script>
      (function () {
        var retry = function () {
          window.location.reload();
        };
        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('online', retry);
        if (navigator.serviceWorker && window.FontFace && document.fonts) {
          navigator.serviceWorker.getRegistration().then(function (registration) {
            if (!registration) {
              return;
            }
            var url = new URL('assets/fonts/Vazirmatn-Variable.woff2', registration.scope).href;
            var font = new FontFace('Vazirmatn', 'url(' + url + ') format("woff2")', {
              weight: '100 900',
            });
            font.load().then(
              function (loaded) {
                document.fonts.add(loaded);
              },
              function () {
                /* Not in the precache: the system fallback stays. */
              },
            );
          });
        }
      })();
    </script>
  </body>
</html>
