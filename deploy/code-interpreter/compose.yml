# MicroVM Code Interpreter (Run Code). Included from the root docker-compose.yml.
# Images: https://github.com/LibreChat-AI/code-interpreter (GHCR, tag CODEAPI_IMAGE_TAG).
#
# Coolify rewrites the root file and drops `include`, so these services do not
# start on Coolify. That is deliberate: code_sandbox bind-mounts /dev/kvm, and a
# missing device fails `docker compose up` for the whole project, including api.
# Local `docker compose up` still starts them. The Attached VM bridge
# (codeapi_bridge, code_bridge_queue, code_redis, code_minio, code_file,
# code_tools, code_egress) lives in the root file so Coolify does create it.
#
# Never give codeapi or code_sandbox a public Coolify domain. LOCAL_MODE trusts
# the Docker network only.

x-codeapi-common: &codeapi-common
  LOCAL_MODE: ${CODEAPI_LOCAL_MODE:-true}
  CODEAPI_HARDENED_SANDBOX_MODE: ${CODEAPI_HARDENED_SANDBOX_MODE:-true}
  CODEAPI_INTERNAL_SERVICE_TOKEN: ${SERVICE_HEX_64_CODEINTERNAL}
  REDIS_HOST: code_redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${SERVICE_PASSWORD_CODEREDIS}

services:
  codeapi:
    image: ghcr.io/librechat-ai/code-interpreter-api:${CODEAPI_IMAGE_TAG:-main}
    restart: unless-stopped
    pull_policy: ${CODEAPI_PULL_POLICY:-missing}
    environment:
      <<: *codeapi-common
      SERVICE_PORT: 3112
      SANDBOX_ENDPOINT: http://code_sandbox:2000/api/v2
      EGRESS_GATEWAY_URL: http://code_egress:3190
      FILE_SERVER_URL: http://code_file:3000
      TOOL_CALL_SERVER_URL: http://code_tools:3033
      CODEAPI_BRIDGE_TOKEN: ${SERVICE_HEX_64_CODEBRIDGE}
      CODEAPI_BRIDGE_AUTH_MODE: paired
      CODEAPI_BRIDGE_DYNAMIC_WORKERS: 'true'
      CODEAPI_HTTP_JSON_LIMIT: 50mb
    depends_on:
      code_redis:
        condition: service_started
      code_tools:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3112/v1/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  code_worker:
    image: ghcr.io/librechat-ai/code-interpreter-worker:${CODEAPI_IMAGE_TAG:-main}
    restart: unless-stopped
    pull_policy: ${CODEAPI_PULL_POLICY:-missing}
    environment:
      <<: *codeapi-common
      SANDBOX_ENDPOINT: http://code_sandbox:2000/api/v2
      EGRESS_GATEWAY_URL: http://code_egress:3190
      CODEAPI_BRIDGE_TOKEN: ${SERVICE_HEX_64_CODEBRIDGE}
      CODEAPI_BRIDGE_AUTH_MODE: paired
      CODEAPI_BRIDGE_DYNAMIC_WORKERS: 'true'
      # Dev-signed execution manifests shipped with the open-source compose; replace for a
      # hardened multi-tenant deployment (see LibreChat-AI/code-interpreter README).
      CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY: ${CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY:-MC4CAQAwBQYDK2VwBCIEIBoxzSJjQ5jTVyuohHtlD+uDGqv/tZ6hQS2CmxuOg2Wn}
      PYTHON_CONCURRENCY: ${CODEAPI_PYTHON_CONCURRENCY:-1}
      OTHER_CONCURRENCY: ${CODEAPI_OTHER_CONCURRENCY:-4}
      WORKER_HEALTH_PORT: 3113
    depends_on:
      code_redis:
        condition: service_started
      code_sandbox:
        condition: service_healthy

  code_sandbox:
    image: ghcr.io/librechat-ai/code-interpreter-sandbox-runner:${CODEAPI_IMAGE_TAG:-main}
    restart: unless-stopped
    pull_policy: ${CODEAPI_PULL_POLICY:-missing}
    privileged: false
    devices:
      - ${CODEAPI_KVM_DEVICE:-/dev/kvm}:/dev/kvm
    environment:
      KVM_ENABLED: 'true'
      LAUNCHER_PACKAGES_HOST: /disabled-host-packages
      CODEAPI_HARDENED_SANDBOX_MODE: ${CODEAPI_HARDENED_SANDBOX_MODE:-true}
      EGRESS_GATEWAY_URL: http://code_egress:3190
      SANDBOX_EXECUTE_BODY_LIMIT: 50mb
      SANDBOX_PACKAGES_DIRECTORY: /pkgs
      SANDBOX_OUTPUT_MAX_SIZE: '65536'
      SANDBOX_MAX_CONCURRENT_JOBS: ${CODEAPI_MAX_CONCURRENT_JOBS:-4}
      SANDBOX_PER_JOB_UIDS: 'true'
      SANDBOX_JOB_UID_BASE: '200000'
      SANDBOX_JOB_GID_BASE: '200000'
      SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS: '3600'
      SANDBOX_RUN_TIMEOUT: '300000'
      SANDBOX_RUN_CPU_TIME: '300000'
      SANDBOX_COMPILE_TIMEOUT: '30000'
      LAUNCHER_VCPUS: ${CODEAPI_SANDBOX_VCPUS:-2}
      LAUNCHER_RAM_MIB: ${CODEAPI_SANDBOX_RAM_MIB:-2048}
      SANDBOX_ALLOWED_LOCAL_NETWORK_PORT: '3190'
      SANDBOX_FORWARD_TARGET: code_egress:3190
      SANDBOX_REQUIRE_EGRESS_MANIFEST: 'true'
      SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY: ${CODEAPI_EXECUTION_MANIFEST_PUBLIC_KEY:-MCowBQYDK2VwAyEAeY3PRoTS3adfU6E3gQUB5hSZdrdMSw6OrKkH4UhYh0U=}
      SANDBOX_RUNNER_CLOCK_SKEW_LIVENESS_LIMIT_SECONDS: '10'
      SANDBOX_RUNNER_HEALTHCHECK_TIMEOUT_SECONDS: '2'
    depends_on:
      code_egress:
        condition: service_started
    healthcheck:
      test: ['CMD', '/usr/local/bin/sandbox-runner-healthcheck.sh']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
