# SaaS configuration for this fork: OpenRouter only, credit packs, search-first UX.
# Loaded in Docker through CONFIG_PATH=/app/config/librechat.saas.yaml (see docker-compose.yml).
# Reference for every key: librechat.example.yaml and docs/saas/BILLING.md.
version: 1.3.18

cache: true

registration:
  # Email + password stays on. The OpenID button appears only once the OPENID_* variables
  # are set in Coolify (see docs/saas/DEPLOY_COOLIFY.md).
  socialLogins: ['openid']
  # Sign-in with a mobile number: a 6-digit code by SMS through Kavenegar (Verify Lookup).
  # Stays off until KAVENEGAR_API_KEY is set. A new number creates an account when
  # registration is open (ALLOW_REGISTRATION). The template must have one %token% parameter.
  phone:
    enabled: true
    provider: 'kavenegar'
    template: '${KAVENEGAR_TEMPLATE}'
    codeTtlSeconds: 120
    resendCooldownSeconds: 60
    maxAttempts: 5
    maxRequestsPerPhonePerHour: 5
    maxRequestsPerIpPerHour: 20

interface:
  customWelcome: 'چطور می‌توانم کمکتان کنم؟'
  # Admins chat on exactly the users' interface. Their own tools (agent builder, prompts, MCP,
  # Skills, marketplace) appear only after turning on «حالت پیشرفته» on the admin page; their
  # role permissions are kept at the ADMIN defaults on every start.
  adminFullAccess: true
  # The values below only seed the USER role; afterwards the admin page («دسترسی کاربران»)
  # owns them, and its changes survive restarts.
  permissionSync: 'seed'
  # Money is shown in Toman. `rate` (Toman per US dollar) is the fallback; the live rate is the
  # free-market dollar on tgju.org, read every 30 minutes, without any extra fee. Pack prices
  # are rounded up to the next 1,000 Toman.
  currency:
    code: 'IRT'
    rate: 270000
    live:
      source: 'tgju'
      refreshMinutes: 30
    priceStep: 1000
  # Users pick from the model specs below only (no raw endpoint/model lists).
  modelSelect: false
  # ChatGPT-style simplicity: no sampling parameters, presets or side-by-side chats.
  parameters: false
  presets: false
  multiConvo: false
  # Bookmarks and the prompt library are power-user tools that crowd the sidebar rail;
  # HiveGPT keeps the rail to chats, files and memory. Set to true to bring them back.
  bookmarks: false
  temporaryChat: true
  webSearch: true
  fileSearch: true
  fileCitations: true
  runCode: false
  # The composer ring shows how full the model's context window is, with the share in percent
  # beside it; the card adds the token breakdown and the share of the pack used. Per-chat cost
  # stays hidden (`contextCost: false`): it left out background work (memory, titles, OCR,
  # speech) and read as less than the pack actually lost.
  contextUsage: true
  contextCost: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  agents:
    # Admins build agents (e.g. translator, summarizer); users can use them.
    use: true
    create: false
    share: false
    public: false
  marketplace:
    use: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  feedback: true
  # Lia is LibreChat's welcome-screen mascot; it does not belong to the HiveGPT brand.
  mascot: false
  # Builder / operator features stay off for end users: adding their own MCP servers, authoring
  # Skills, the build-info panel. Using Skills is on, for the deployment skills shipped in `skill/`
  # (Persian calendar, orthography, content). `permissionSync: 'seed'` leaves an existing USER role
  # as stored, so on a running deployment turn it on there («دسترسی کاربران» → مهارت‌ها).
  # The programming API (remoteAgents) is off for the role; turn it on
  # for everyone on the admin page («دسترسی کاربران» → API) or per user in the users list. `use` is on so
  # users can pick the servers configured below (`mcpServers:`, e.g. Higgsfield) in the composer.
  # With `permissionSync: 'seed'` an existing deployment also turns it on for the USER role on the
  # admin page («دسترسی کاربران» → MCP).
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  skills:
    use: true
    create: false
    share: false
    public: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  buildInfo: false
  # Users see and edit their memories under Settings → Personalization.
  memories: true

# Credits are micro-dollars of marked-up usage: 1,000,000 credits = $1 billed to the user.
# Each request deducts tokens x (OpenRouter USD price x priceMultiplier) in credits.
balance:
  enabled: true
  # Free trial for every new account: $0.20 of usage.
  startBalance: 200000
  autoRefillEnabled: false
  # The share of the current allowance used: the free trial before a pack, the pack after. Money
  # appears only as the pack prices when there is one to buy; users never see raw credits.
  display: pack
  # Twice the earlier sizes (2M / 5M / 15M), so a pack lasts twice as long. The price follows
  # the credits (credits / 1,000,000 x the Toman rate), so it doubles too.
  # These are the starting packs. Admins manage packs on «پنل مدیریت ← بسته‌ها» (name, price,
  # note and what each includes); once saved there, that list replaces this one.
  # `grants` (optional, per pack) says what the pack includes while it is the user's pack:
  # `local` and `private` models, `media` (image, video, voice, Higgsfield) and `api`. `true`
  # includes it, `false` leaves it out; an omitted class keeps the rule without packs (the role
  # on «دسترسی کاربران» for local, private and API; any pack for media). A user's own setting on
  # the admin page still wins. Example: `grants: { private: true, media: true, api: false }`.
  packs:
    - id: starter
      label: 'بسته پایه'
      credits: 4000000
      description: '$4 of usage at marketed prices'
    - id: standard
      label: 'بسته استاندارد'
      credits: 10000000
      description: '$10 of usage at marketed prices'
    - id: pro
      label: 'بسته حرفه‌ای'
      credits: 30000000
      description: '$30 of usage at marketed prices'
  # Where the "Buy a pack" button of the 90%-used warning links (no payment gateway yet,
  # e.g. a contact/Telegram page). Leave unset to show the warning without a button.
  # purchaseUrl: 'https://example.com/buy'

transactions:
  enabled: true

# The programming API (Settings → API keys, base URL `<site>/api/agents/v1`). Each user may make
# 60 model calls a minute across all their keys (coding clients make several per task and retry
# a 429 after `Retry-After`). The document of the API is served at `/api/openapi.json`, with the
# interactive reference at `/api/docs`; the user guide is docs/api/README.fa.md.
rateLimits:
  api:
    userMax: 60
    userWindowInMinutes: 1

openapi:
  enabled: true

# Long-term memory. A small, cheap model reads the last messages after each turn and saves
# stable facts. It runs on the ZDR endpoint, so memory processing never goes to a provider
# that keeps data. Chats on the local models read saved memories but never write any: no memory
# agent runs on them and feedback on their answers is not learned (nothing leaves the server).
# A thumbs-down needs a reason, and that reason (or a thumbs-up's note) becomes one line of the
# `preferences` memory; a line already there is kept once.
# Image and video generation with Higgsfield (https://higgsfield.ai) over its official remote MCP
# server. Each user connects their own Higgsfield account from the composer's MCP picker (OAuth
# with dynamic client registration, no API key); generations use that account's Higgsfield credits,
# not HiveGPT balance. The OAuth redirect is `${DOMAIN_SERVER}/api/mcp/higgsfield/oauth/callback`,
# so DOMAIN_SERVER must be the public https origin. Confidential and local chats never reach it:
# their specs hide the picker and the server drops tools a request picks for itself.
# Finished videos are links to Higgsfield's storage; to play them inline, add that host to
# CSP_MEDIA_SRC_EXTRA (otherwise the link still opens them).
# Shared connection: the account with HIGGSFIELD_SHARED_OWNER_EMAIL connects once from the picker;
# then users with a pack (and admins) run on that connection and its Higgsfield credits without
# connecting their own. «رسانه» in the admin users list allows or blocks one user. Users who may
# not use it, and the owner, connect their own account as before. Unset, nothing is shared.
mcpSettings:
  allowedDomains:
    - 'mcp.higgsfield.ai'
    - 'higgsfield.ai'
    - '*.higgsfield.ai'
mcpServers:
  higgsfield:
    type: streamable-http
    url: 'https://mcp.higgsfield.ai/mcp'
    title: 'Higgsfield'
    description: 'ساخت تصویر و ویدیو با حساب Higgsfield (حساب خودتان یا حساب مشترک تیم). همه روش‌ها: منوی حساب ← «ساخت تصویر و ویدیو»'
    iconPath: '/assets/higgsfield.svg'
    startup: false
    requiresOAuth: true
    sharedOAuth:
      ownerEmail: '${HIGGSFIELD_SHARED_OWNER_EMAIL}'
      allow: 'paid'
    chatMenu: true
    timeout: 300000
    initTimeout: 30000
    serverInstructions: |
      Higgsfield generates images and videos with a Higgsfield account and its credits (the
      user's own, or the team account shared with them).
      Before any generation, tell the user in Persian which model, length and resolution you will
      use and how many Higgsfield credits it costs, and wait for their confirmation. Write the
      generation prompt in English for the best result, keeping the user's intent. When the result
      is ready, give its direct link on its own line so the chat can show it, plus a one-line
      Persian description. Images attached to the chat cannot be passed to Higgsfield; offer its
      upload window instead.

# Image, video and speech generation the chat model calls on its own when a user asks, also in
# the middle of a conversation (no special mode). Charged to the user's HiveGPT credit: the
# estimate is held first, the real provider cost x the endpoint's priceMultiplier is charged
# after, and a failed generation costs nothing. Only users with a pack (bought or granted) may
# generate; others are told how to unlock it. An admin can switch it on or off per user
# («رسانه» in the users list). Confidential and local chats never get these tools.
mediaGeneration:
  enabled: true
  paidOnly: true
  endpoint: 'OpenRouter'
  image:
    model: 'google/gemini-3.1-flash-image' # Nano Banana 2
    estimateUsd: 0.08
  video:
    model: 'google/veo-3.1-lite' # 4, 6 or 8 seconds, with audio
    resolution: '720p'
    defaultDuration: 4
    maxDuration: 8
    estimateUsdPerSecond: 0.25
    # Runs in the background: the chat shows a card that becomes the player when the job ends,
    # so a closed page or a dropped stream loses nothing; charged only when the file arrives.
  speech:
    model: 'google/gemini-3.8-flash-tts'
    voice: 'Kore'
    voices: ['Charon', 'Leda', 'Puck']
    format: 'pcm' # Gemini TTS returns PCM only; saved as WAV
    instructions: 'Speak naturally and clearly in the language of the text, with a warm tone.'
    estimateUsd: 0.03
  # Higgsfield's own API (https://console.higgsfield.ai): a separate option from the MCP server
  # above, paid from the deployment's Higgsfield balance and charged to users at `priceUsd`
  # (set it to Higgsfield's list price, times your markup). Off until both keys are set.
  higgsfield:
    apiKeyId: '${HIGGSFIELD_API_KEY_ID}'
    apiKeySecret: '${HIGGSFIELD_API_KEY_SECRET}'
    models:
      - id: 'higgsfield-ai/soul/v2/standard'
        kind: 'image'
        label: 'SOUL V2'
        description: 'Fashion and portrait photos with a strong style'
        priceUsd: 0.12

memory:
  personalize: true
  messageWindowSize: 5
  tokenLimit: 2000
  validKeys: ['profile', 'preferences', 'work', 'goals', 'context']
  excludeEndpoints: ['Local', 'LocalUncensored', 'LocalUncensoredThink']
  excludeEndpointsRead: true
  learnFromFeedback: true
  agent:
    enabled: true
    provider: 'OpenRouterPrivate'
    model: 'google/gemini-3.8-flash'
    model_parameters:
      temperature: 0.1
    instructions: |
      You maintain long-term memory about the user for future conversations.
      Save only stable, useful facts the user stated about themselves: name, language and tone
      they prefer, job and field, ongoing projects and goals, recurring constraints.
      Also save anything the user explicitly asks you to remember, and delete what they ask
      you to forget.
      Never save: one-off questions, content of documents, passwords, keys, health, financial or
      other sensitive data, or guesses about the user.
      Update an existing key instead of adding a duplicate. Keep each value short.
      Lines in `preferences` that start with `- Disliked (` or `- Liked (` come from the user's
      feedback on answers: keep them when you rewrite that key, and follow them.
      Write values in the language the user uses.
      VALID KEYS: profile, preferences, work, goals, context
      TOKEN LIMIT: Maximum 2000 tokens across all memory values.
      If nothing in the latest messages is worth remembering, end the turn without any tool call.

# Deterministic Persian date and spelling tools (`persian_calendar`, `persian_normalize`).
# The fixed Solar Hijri holidays are built in. The lunar ones move every year with the moon
# sighting, so add each year's official list here once it is published, one entry per day with
# the Solar Hijri date in Latin digits:
#   holidays:
#     - { date: 'YYYY-MM-DD', title: 'عنوان تعطیلی' }
persianTools:
  chat: true
  timezone: 'Asia/Tehran'
  holidays: []

# The article wizard and the slide builder (experimental): ordinary chats get two tools that turn
# the conversation into an editable Word file (`create_word_document`) and an editable PowerPoint
# deck (`create_presentation`), right to left in Vazirmatn. Files are built on this server and
# cost nothing beyond the chat; confidential and local models do not get them. The «ساختن» rows
# of the composer's `+` menu follow `word` and `slides`; the skills «ویزارد مقاله» and
# «ساخت پاورپوینت» carry the step-by-step flow.
officeTools:
  word: true
  slides: true
  maxSlides: 40
  maxImages: 20
  embedFonts: true

# Agent browser (experimental): the `browser` service in docker-compose.yml. Who may open one is
# set per pack and per user in the admin panel (admins always may); these are the server limits.
browser:
  enabled: true
  # Browsers open at once on the whole server
  maxSessions: 10
  # A browser closes after this many minutes without a step, and after maxMinutes in any case
  idleMinutes: 3
  maxMinutes: 20
  # New browsers are refused at or above these: host and browser-container RAM, host CPU over
  # the last minute. Users then see «ظرفیت فعلاً وجود ندارد، با پشتیبانی تماس بگیرید».
  capacity:
    ram: 85
    cpu: 90
  # Days the admin's browser log keeps an entry
  logDays: 90

webSearch:
  # Paid Google results first; when one provider's plan runs out (or it rejects its key) the
  # next answers, and the free self-hosted SearXNG is the last resort. Providers without a key
  # are skipped. The admin page («وضعیت سرویس‌ها») shows each one's remaining credit.
  providerChain: ['serper', 'serpapi', 'tavily', 'searxng']
  serpapiApiKey: '${SERPAPI_API_KEY}'
  providerFailover:
    exhaustedCooldownSeconds: 3600
    rateLimitCooldownSeconds: 60
    unauthorizedCooldownSeconds: 3600
    timeoutMs: 10000
    serpapiHl: 'fa'
    serpapiGl: 'ir'
  # Self-hosted SearXNG for results, Keenable (keyless) to read pages, no reranker.
  searchProvider: searxng
  searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
  # Keenable works without a key; set KEENABLE_API_KEY to lift its public rate limit.
  scraperProvider: keenable
  # Reranker left unpinned on purpose: Jina is used when JINA_API_KEY is set, else Cohere
  # when COHERE_API_KEY is set, else no reranking. Pinning `rerankerType: jina` without a
  # key would disable web search entirely.
  jinaApiKey: '${JINA_API_KEY}'
  cohereApiKey: '${COHERE_API_KEY}'
  searxngSearchOptions:
    engines:
      - google
      - bing
      - brave
      - startpage
      - wikipedia
  # The internal SearXNG container is a private address; exempt exactly that host:port.
  allowedAddresses:
    - 'searxng:8080'

# Upload limits, in MB (upstream default: 512 MB per file). Custom endpoints (OpenRouter…) use
# the `agents` entry. Allowed file types stay at the defaults.
fileConfig:
  serverFileSizeLimit: 50
  avatarSizeLimit: 2
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 100
    agents:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 100

# Text extraction for PDFs and images (file search, and models that cannot read images).
# PDF pages with a usable text layer are read for free; only scanned or garbled pages are OCR'd,
# through the route that matches the conversation:
#   public  -> vision model on the regular OpenRouter endpoint
#   private -> the same model on OpenRouterPrivate, whose addParams enforce zero data retention
#   local   -> Tesseract on this server; the document never leaves the machine
# Pricing: vision OCR is billed at the model's real token price x the endpoint's priceMultiplier,
# exactly like chat. Local OCR is billed per page from server cost: EUR 80/month ~ $93 x 70% local
# share / busy seconds (30% of a month) ~ $0.0000825/s x ~3 s/page (Tesseract fas, 200 DPI, one
# core) ~ $0.00025/page. Keep the model ids concrete (gemini-3.8-flash has ZDR endpoints) so the
# price lookup works.
documentOcr:
  enabled: true
  maxPages: 100
  concurrency: 4
  dpi: 200
  maxSide: 2000
  # Which route a conversation uses: specs with `privacy: 'local'`/`'private'` and these endpoints
  # (the stricter wins; a stored conversation can only become stricter, never public).
  localEndpoints: ['Local', 'LocalUncensored', 'LocalUncensoredThink']
  privateEndpoints: ['OpenRouterPrivate']
  public:
    endpoint: 'OpenRouter'
    model: 'google/gemini-3.8-flash'
  private:
    endpoint: 'OpenRouterPrivate'
    model: 'google/gemini-3.8-flash'
  local:
    engine: 'tesseract'
    languages: 'fas+eng'
    pricePerPage: 0.00025
  timeoutMs: 120000
speech:
  # Server speech (STT/TTS) through OpenRouter's OpenAI-compatible /audio/* API, billed like chat:
  # credits = provider cost (OpenRouter usage.cost / generation total_cost) x the endpoint's
  # priceMultiplier x 1,000,000. Local chats (localEndpoints / spec privacy: local) never send audio
  # or text out: the client uses browser speech for them and the server refuses (409 local_route).
  # Private chats (privateEndpoints / spec privacy: private) use `private` with provider.zdr: true.
  stt:
    hive:
      public:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.5-transcribe' # $2/M audio-in, $12/M out (~$0.004/min)
      private:
        endpoint: 'OpenRouterPrivate'
        model: 'elevenlabs/scribe-v2' # ZDR on OpenRouter, 90+ langs incl. Persian (~$0.0037/min)
      language: 'fa'
      maxBytes: 10485760 # 10 MB upload cap
      maxDurationSeconds: 120 # client auto-stops the recording here
      timeoutMs: 60000
      estimateUsdPerMinute: 0.01 # balance hold / charge when no cost is reported
  tts:
    maxInputChars: 4096
    hive:
      public:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.8-flash-tts' # Gemini TTS supports fa-IR; ZDR on Google (Vertex)
      private:
        endpoint: 'OpenRouterPrivate'
        model: 'google/gemini-3.8-flash-tts'
      voices: ['Kore', 'Charon', 'Leda', 'Puck'] # first = default
      instructions: 'Read aloud in natural, clear Persian (Farsi) with a warm, conversational tone.'
      responseFormat: 'pcm' # Gemini TTS returns PCM only; served as WAV
      pcmSampleRate: 24000
      chunkChars: 1500
      timeoutMs: 60000
      estimateUsdPerMinute: 0.02
      costLookupAttempts: 4
      costLookupDelayMs: 750
  speechTab:
    speechToText:
      languageSTT: 'fa-IR'
    textToSpeech:
      languageTTS: 'fa-IR'

# In-app pack purchase. A gateway is offered once its key is set; the amount is always computed
# on the server from the pack's Toman price, and a payment credits the account exactly once.
# Invite rewards. Each user has a link (account menu → «دعوت از دوستان», or Settings → Account):
# when someone signs up through it and verifies a mobile number, the inviter gets
# `referrerCredits` and the new account `inviteeCredits` on top of its start balance, once.
# 1,000,000 credits = $1 at list price. A mobile is unique per account, so throwaway emails
# cannot farm rewards; an inviter is paid for at most `maxRewardsPerReferrer` invites.
referral:
  enabled: true
  referrerCredits: 500000
  inviteeCredits: 200000
  maxRewardsPerReferrer: 20
  claimWindowDays: 7
  requirePhone: true

payments:
  enabled: true
  orderTtlMinutes: 30
  requestTimeoutMs: 15000
  description: 'خرید {pack} در HiveGPT'
  gateways:
    zarinpal:
      enabled: true
      merchantId: '${ZARINPAL_MERCHANT_ID}'
      sandbox: false
      currency: 'IRR'
    idpay:
      enabled: true
      apiKey: '${IDPAY_API_KEY}'
      sandbox: false

# Admin «وضعیت سرویس‌ها»: credit and health of OpenRouter, the search providers, Kavenegar,
# the payment gateways, SearXNG and the local model, refreshed in the background.
serviceStatus:
  refreshIntervalSeconds: 600
  warningPercent: 20
  warningDays: 7
  historyDays: 30
  ollamaUrl: 'http://ollama:11434'

endpoints:
  agents:
    capabilities:
      - deferred_tools
      - file_search
      - web_search
      - artifacts
      - context
      - tools
      - memory
      - skills
      # The question form: the model asks its clarifying questions in a form in the chat.
      - ask_user_question
  custom:
    # The name must stay "OpenRouter": live per-model pricing is fetched only for that name.
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default: ['~google/gemini-flash-latest']
        # Required: fetching the model list is what loads OpenRouter's USD prices.
        fetch: true
      # Users pay OpenRouter's price x 1.3 (30% margin). Change and redeploy to reprice.
      priceMultiplier: 1.3
      titleConvo: true
      titleModel: '~google/gemini-flash-latest'
      # OpenRouter models use a variety of stop tokens.
      dropParams: ['stop']
      # PDFs go to the model only when it reads files natively. Without this, OpenRouter OCRs
      # them with paid "mistral-ocr" (billed to our account, not ZDR); models without file
      # input get their PDFs through our own OCR instead.
      addParams:
        plugins:
          - id: 'file-parser'
            pdf:
              engine: 'native'
      # Users never see the host's name: errors and icon labels say HiveGPT, and icons show
      # each model's maker (Claude, GPT, Gemini…) from the model id.
      modelDisplayLabel: 'HiveGPT'
      # Do not add `headers` here: they make the price cache per-user (one fetch per user).

    # Confidential chats: same OpenRouter account, but every request asks OpenRouter to route
    # only to Zero-Data-Retention endpoints of providers that do not collect data. Requests fail
    # rather than fall back when no such endpoint is available. Prices are fetched live (the
    # base URL identifies OpenRouter) and marked up like the main endpoint.
    - name: 'OpenRouterPrivate'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        # Concrete ids: the ~…-latest aliases have no ZDR endpoints.
        default: ['google/gemini-3.8-flash']
        fetch: true
      addParams:
        provider:
          zdr: true
          data_collection: 'deny'
        # Never let OpenRouter OCR PDFs with Mistral (not ZDR); see the endpoint above.
        plugins:
          - id: 'file-parser'
            pdf:
              engine: 'native'
      priceMultiplier: 1.3
      titleConvo: true
      titleModel: 'google/gemini-3.8-flash'
      dropParams: ['stop']
      modelDisplayLabel: 'محرمانه'

    # Internal model served by the `ollama` container: nothing leaves the server.
    # Slow on CPU and much weaker than cloud models.
    #
    # Local prices recover the server's cost (docs/saas/BILLING.md, «قیمت مدل‌های لوکال»):
    #   server ≈ €80/month ≈ $93; 70% of it is charged to the local models ($65) and spread
    #   over the hours the model is busy (30% of the month ≈ 219 h), i.e. $0.0000825 per
    #   busy second. A token costs that divided by the model's speed on this CPU
    #   (Ryzen 9 3900, 12 threads), in USD per 1M tokens:
    #     gemma3:4b             ~100 tok/s reading, ~15 tok/s writing → 0.8 / 5.5
    #     Qwen 3.6 35B (3B act.) ~50 tok/s reading, ~10 tok/s writing → 1.6 / 8
    #   A stronger model is slower per token, so it costs more. Thinking tokens bill as output,
    #   so the "think" spec costs more per answer at the same rate. Re-measure the speeds
    #   (`ollama run --verbose`) and scale these numbers when the server or models change.
    - name: 'Local'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1'
      models:
        # Built by the ollama container from LOCAL_MODEL (gemma3:4b) with the thread count
        # and context set; see docker-compose.yml.
        default: ['hivegpt-local']
        fetch: false
      tokenConfig:
        'hivegpt-local':
          prompt: 0.8
          completion: 5.5
          context: 8192
      # A title would be a second slow local call; chats keep the default title.
      titleConvo: false
      modelDisplayLabel: 'داخلی'
      iconURL: '/assets/logo.svg'

    # Admin-only: Qwen 3.6 35B (3B active) with its refusals removed (abliterated), also on the
    # `ollama` container. Two endpoints so one spec answers at once and the other thinks first:
    # Ollama turns thinking off for `reasoning_effort: none`. Only the admin-only specs below
    # use them; users' requests must name a spec they have, so they cannot reach these.
    - name: 'LocalUncensored'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1'
      models:
        default: ['hivegpt-uncensored']
        fetch: false
      addParams:
        reasoning_effort: 'none'
      tokenConfig:
        'hivegpt-uncensored':
          prompt: 1.6
          completion: 8
          context: 16384
      titleConvo: false
      modelDisplayLabel: 'بدون سانسور'
      iconURL: '/assets/logo.svg'
    - name: 'LocalUncensoredThink'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1'
      models:
        default: ['hivegpt-uncensored']
        fetch: false
      tokenConfig:
        'hivegpt-uncensored':
          prompt: 1.6
          completion: 8
          context: 16384
      titleConvo: false
      modelDisplayLabel: 'بدون سانسور — فکر عمیق'
      iconURL: '/assets/logo.svg'

modelSpecs:
  enforce: true
  prioritize: true
  # New models appear on their own. The server reads OpenRouter's catalogue (/models) and its
  # Zero-Data-Retention list (/endpoints/zdr) at startup and every `refreshHours`, in the
  # background (requests never wait on it; a failed read keeps the last one), and adds:
  # - public specs: every `~{provider}/{family}-latest` alias of a provider below that no spec
  #   in `list` already uses, named `auto-{provider}-{family}`, after that brand's specs;
  # - confidential specs (CONFIDENTIAL RULE: only concrete model ids that are on the ZDR list —
  #   never an alias, never a model without a ZDR endpoint): `auto-private-{family}` for each
  #   family below that has no private spec yet. Private specs in `list` move to the newest ZDR
  #   version of their family, and one whose model leaves the ZDR list is removed. Until the
  #   ZDR list has been read once, private specs are served exactly as written here.
  # Role/user access to private specs applies to discovered ones too. To hide a discovered
  # model, add its id (alias or concrete) to `exclude`; specs written in `list` always win.
  autoDiscover:
    enabled: true
    endpoint: 'OpenRouter'
    privateEndpoint: 'OpenRouterPrivate'
    refreshHours: 6
    # New brand groups go before the tools group.
    insertBeforeGroup: 'ابزارها'
    # OpenRouter provider prefix → menu group and icon.
    providers:
      anthropic: { group: 'Claude', icon: 'anthropic' }
      openai: { group: 'ChatGPT', icon: 'openai' }
      google: { group: 'Gemini', icon: 'google' }
      deepseek: { group: 'DeepSeek', icon: 'deepseek' }
      x-ai: { group: 'Grok', icon: 'xai' }
      z-ai: { group: 'GLM', icon: 'zhipu' }
      qwen: { group: 'Qwen', icon: 'qwen' }
      moonshotai: { group: 'Kimi', icon: 'moonshot' }
    # A provider not listed above still gets its `-latest` models, in a group named after it
    # (as OpenRouter writes it), after the listed groups: a new AI company shows up without a
    # config change. New specs carry their publish date and read «جدید» in the menu for two
    # weeks, with their price. Such a group uses the company's built-in icon when there is one
    # (Mistral, Cohere…), else `otherProvidersIcon` (default `/assets/ai-provider.svg`).
    otherProviders: true
    # Older families that would duplicate a menu entry: GPT Mini (ChatGPT Mini is GPT Luna) and
    # DeepSeek V4 Flash (DeepSeek Flash follows the newest Flash).
    exclude:
      - '~openai/gpt-mini-latest'
      - '~deepseek/deepseek-v4-flash-latest'
    private:
      enabled: true
      groupIcon: '/assets/private.svg'
      # Model families offered as confidential (a concrete id's name without its version:
      # anthropic/claude-sonnet-5.5 → claude-sonnet, openai/gpt-6.1-sol → gpt-sol).
      families:
        - 'claude-sonnet'
        - 'claude-opus'
        - 'claude-haiku'
        - 'gpt-sol'
        - 'gpt-luna'
        - 'gpt-astra'
        - 'gemini-flash'
        - 'gemini-pro'
        - 'gemini-argon'
  # Grouped by AI brand in this order; every spec names its own icon (`iconURL`), so no host
  # name or logo reaches users. Spec names of earlier versions (fast, smart, gpt, economy, pro,
  # research, perplexity, documents, private-*, local) are kept so old chats continue.
  # `~…-latest` ids follow each brand's newest model on OpenRouter.
  # No spec is marked `default`/`softDefault` on purpose: a user who never picked a model
  # starts with an empty selector and must choose one before sending (their last pick is
  # remembered for later new chats).
  list:
    # --- Claude ---
    - name: 'smart'
      label: 'Claude Sonnet'
      description: 'دقیق و متعادل؛ برای نوشتن، تحلیل و کدنویسی'
      group: 'Claude'
      groupIcon: 'anthropic'
      iconURL: 'anthropic'
      webSearch: true
      fileSearch: true
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-sonnet-latest'
        modelLabel: 'Claude Sonnet'
    - name: 'pro'
      label: 'Claude Opus'
      description: 'قوی‌ترین Claude برای کارهای پیچیده؛ مصرف بیشتری دارد'
      group: 'Claude'
      iconURL: 'anthropic'
      webSearch: true
      fileSearch: true
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-opus-latest'
        modelLabel: 'Claude Opus'
    - name: 'claude-fable'
      label: 'Claude Fable'
      description: 'قوی‌ترین مدل Anthropic، یک رده بالاتر از Opus؛ برای سخت‌ترین کارها. گران‌ترین Claude'
      group: 'Claude'
      iconURL: 'anthropic'
      webSearch: true
      fileSearch: true
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-fable-latest'
        modelLabel: 'Claude Fable'
    - name: 'claude-haiku'
