# SaaS configuration for this fork: OpenRouter only, credit packs, search-first UX.
# Loaded in Docker through CONFIG_PATH=/app/config/librechat.saas.yaml (see docker-compose.yml).
# Reference for every key: librechat.example.yaml and docs/saas/BILLING.md.
version: 1.3.18

cache: true

registration:
  # Email + password stays on. The OpenID button appears only once the OPENID_* variables
  # are set in Coolify (see docs/saas/DEPLOY_COOLIFY.md).
  socialLogins: ['openid']
  # Sign-in with a mobile number: a 6-digit code by SMS through Kavenegar (Verify Lookup).
  # Stays off until KAVENEGAR_API_KEY is set. A new number creates an account when
  # registration is open (ALLOW_REGISTRATION). The template must have one %token% parameter.
  phone:
    enabled: true
    provider: 'kavenegar'
    template: '${KAVENEGAR_TEMPLATE}'
    codeTtlSeconds: 120
    resendCooldownSeconds: 60
    maxAttempts: 5
    maxRequestsPerPhonePerHour: 5
    maxRequestsPerIpPerHour: 20

interface:
  customWelcome: 'چطور می‌توانم کمکتان کنم؟'
  # Admins chat on exactly the users' interface. Their own tools (agent builder, prompts, MCP,
  # Skills, marketplace) appear only after turning on «حالت پیشرفته» on the admin page; their
  # role permissions are kept at the ADMIN defaults on every start.
  adminFullAccess: true
  # The values below only seed the USER role; afterwards the admin page («دسترسی کاربران»)
  # owns them, and its changes survive restarts.
  permissionSync: 'seed'
  # Money is shown in Toman. `rate` (Toman per US dollar) is the fallback; the live rate is the
  # free-market dollar on tgju.org, read every 30 minutes, without any extra fee. Pack prices
  # are rounded up to the next 1,000 Toman. `maxAgeMinutes` is how old a live reading may be
  # before the fallback rate takes over again: a source that stopped answering would otherwise
  # price a pack with a rate from months ago.
  currency:
    code: 'IRT'
    rate: 270000
    live:
      source: 'tgju'
      refreshMinutes: 30
      maxAgeMinutes: 2880
    priceStep: 1000
  # Users pick from the model specs below only (no raw endpoint/model lists).
  modelSelect: false
  # ChatGPT-style simplicity: no sampling parameters, presets or side-by-side chats.
  parameters: false
  presets: false
  multiConvo: false
  # Bookmarks and the prompt library are power-user tools that crowd the sidebar rail;
  # HiveGPT keeps the rail to chats, files and memory. Set to true to bring them back.
  bookmarks: false
  temporaryChat: true
  webSearch: true
  fileSearch: true
  fileCitations: true
  # Needed for Attached VM: agents call execute_code / bash on the paired worker.
  # This is not the Coolify microVM interpreter (that stack stays off; no /dev/kvm).
  runCode: true
  # The composer ring shows how full the model's context window is, with the share in percent
  # beside it; the card adds the token breakdown and the share of the pack used. Per-chat cost
  # stays hidden (`contextCost: false`): it left out background work (memory, titles, OCR,
  # speech) and read as less than the pack actually lost.
  contextUsage: true
  contextCost: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  agents:
    # Admins build agents (e.g. translator, summarizer); users can use them.
    use: true
    create: false
    share: false
    public: false
  marketplace:
    use: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  feedback: true
  # Lia is LibreChat's welcome-screen mascot; it does not belong to the HiveGPT brand.
  mascot: false
  # Builder / operator features stay off for end users: adding their own MCP servers, authoring
  # Skills, the build-info panel. Using Skills is on, for the deployment skills shipped in `skill/`
  # (Persian calendar, orthography, content). `permissionSync: 'seed'` leaves an existing USER role
  # as stored, so on a running deployment turn it on there («دسترسی کاربران» → مهارت‌ها).
  # The programming API (remoteAgents) is off for the role; turn it on
  # for everyone on the admin page («دسترسی کاربران» → API) or per user in the users list. `use` is on so
  # users can pick the servers configured below (`mcpServers:`, e.g. Higgsfield) in the composer.
  # With `permissionSync: 'seed'` an existing deployment also turns it on for the USER role on the
  # admin page («دسترسی کاربران» → MCP).
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  skills:
    use: true
    create: false
    share: false
    public: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  buildInfo: false
  # Users see and edit their memories under Settings → Personalization.
  memories: true

# Credits are micro-dollars of marked-up usage: 1,000,000 credits = $1 billed to the user.
# Each request deducts tokens x (OpenRouter USD price x priceMultiplier) in credits.
balance:
  enabled: true
  # Free trial for every new account: $0.20 of usage.
  startBalance: 200000
  autoRefillEnabled: false
  # The share of the current allowance used: the free trial before a pack, the pack after. Money
  # appears only as the pack prices when there is one to buy; users never see raw credits.
  display: pack
  # Twice the earlier sizes (2M / 5M / 15M), so a pack lasts twice as long. The price follows
  # the credits (credits / 1,000,000 x the Toman rate), so it doubles too.
  # These are the starting packs. Admins manage packs on «پنل مدیریت ← بسته‌ها» (name, price,
  # note and what each includes); once saved there, that list replaces this one.
  # `grants` (optional, per pack) says what the pack includes while it is the user's pack:
  # `local` and `private` models, `media` (image, video, voice, Higgsfield) and `api`. `true`
  # includes it, `false` leaves it out; an omitted class keeps the rule without packs (the role
  # on «دسترسی کاربران» for local, private and API; any pack for media). A user's own setting on
  # the admin page still wins. Example: `grants: { private: true, media: true, api: false }`.
  packs:
    - id: starter
      label: 'بسته پایه'
      credits: 4000000
      description: '$4 of usage at marketed prices'
    - id: standard
      label: 'بسته استاندارد'
      credits: 10000000
      description: '$10 of usage at marketed prices'
    - id: pro
      label: 'بسته حرفه‌ای'
      credits: 30000000
      description: '$30 of usage at marketed prices'
    # Unlimited Claude plan: dedicated Messages API (ClaudeTime), shared 4-seat pool, no credit spend.
    - id: claude-time
      kind: time
      label: 'پلن نامحدود Claude'
      durationDays: 30
      endpoint: 'ClaudeTime'
      description: '۳۰ روز دسترسی نامحدود به Claude (ظرفیت مشترک)'
  # Shared seat pool for kind: time packs (max 4 concurrent generations globally, 1 per user).
  timePack:
    maxSeats: 4
    maxSeatsPerUser: 1
    restMinutes: 60
    usageWindowHours: 24
    oversellMinMeteredCredits: 5000000
  # Where the "Buy a pack" button of the 90%-used warning links (no payment gateway yet,
  # e.g. a contact/Telegram page). Leave unset to show the warning without a button.
  # purchaseUrl: 'https://example.com/buy'

transactions:
  enabled: true

# The programming API (Settings → API keys, base URL `<site>/api/agents/v1`). Each user may make
# 60 model calls a minute across all their keys (coding clients make several per task and retry
# a 429 after `Retry-After`). The document of the API is served at `/api/openapi.json`, with the
# interactive reference at `/api/docs`; the user guide is docs/api/README.fa.md.
rateLimits:
  api:
    userMax: 60
    userWindowInMinutes: 1

openapi:
  enabled: true

# Long-term memory. A small, cheap model reads the last messages after each turn and saves
# stable facts. It runs on the ZDR endpoint, so memory processing never goes to a provider
# that keeps data. Chats on the local models read saved memories but never write any: no memory
# agent runs on them and feedback on their answers is not learned (nothing leaves the server).
# A thumbs-down needs a reason, and that reason (or a thumbs-up's note) becomes one line of the
# `preferences` memory; a line already there is kept once.
# Image and video generation with Higgsfield (https://higgsfield.ai) over its official remote MCP
# server. Each user connects their own Higgsfield account from the composer's MCP picker (OAuth
# with dynamic client registration, no API key); generations use that account's Higgsfield credits,
# not HiveGPT balance. The OAuth redirect is `${DOMAIN_SERVER}/api/mcp/higgsfield/oauth/callback`,
# so DOMAIN_SERVER must be the public https origin. Confidential and local chats never reach it:
# their specs hide the picker and the server drops tools a request picks for itself.
# Finished videos are links to Higgsfield's storage; to play them inline, add that host to
# CSP_MEDIA_SRC_EXTRA (otherwise the link still opens them).
# Shared connection: the admin panel (Service status → Higgsfield) picks the account whose
# connection is shared (HIGGSFIELD_SHARED_OWNER_EMAIL is only a fallback); it connects once from
# the picker. Admins, and users granted «حساب مشترک Higgsfield» in the admin users list, then run
# on that connection and its Higgsfield credits. Packs and «رسانه» do not grant it. A user's own
# connection always wins, and anyone not granted connects their own account as before.
mcpSettings:
  allowedDomains:
    - 'mcp.higgsfield.ai'
    - 'higgsfield.ai'
    - '*.higgsfield.ai'
    # Direct Iranian MCP providers (not via mcpfarsi router)
    - 'hub.arzbin.com'
    - 'mcp.dadrasai.com'
    - 'www.zarinpal.com'
    - 'zarinpal.com'
    - 'pasavard.ir'
    - 'vibefarsi.ir'
    - 'mcp.arvancloud.ir'
    - 'arvancloud.ir'
    # Users' own sites (cPanel, WordPress, NewsWatch) go through the internal `sitemcp`
    # service, which reaches public addresses only. Exactly this host, port and scheme.
    - 'http://sitemcp:3200'
mcpServers:
  higgsfield:
    type: streamable-http
    url: 'https://mcp.higgsfield.ai/mcp'
    title: 'Higgsfield'
    description: 'ساخت تصویر و ویدیو با حساب Higgsfield (حساب خودتان یا حساب مشترک تیم). همه روش‌ها: منوی حساب ← «ساخت تصویر و ویدیو»'
    iconPath: '/assets/higgsfield.svg'
    startup: false
    requiresOAuth: true
    # Shared account: chosen in the admin panel (Service status → Higgsfield); the env var is
    # only a fallback. Admins and users granted «shared Higgsfield account» use it.
    sharedOAuth:
      ownerEmail: '${HIGGSFIELD_SHARED_OWNER_EMAIL}'
    chatMenu: true
    timeout: 300000
    initTimeout: 30000
    serverInstructions: |
      Higgsfield generates images and videos with a Higgsfield account and its credits (the
      user's own, or the team account shared with them).
      Before any generation, tell the user in Persian which model, length and resolution you will
      use and how many Higgsfield credits it costs, and wait for their confirmation. Write the
      generation prompt in English for the best result, keeping the user's intent. When the result
      is ready, give its direct link on its own line so the chat can show it, plus a one-line
      Persian description. Images attached to the chat cannot be passed to Higgsfield; offer its
      upload window instead.
  # Direct provider MCPs (provider's own HTTPS endpoint; no mcpfarsi middleman).
  arzbin:
    type: streamable-http
    url: 'https://hub.arzbin.com/mcp'
    title: 'ارزبین'
    description: 'قیمت لحظه‌ای دلار، یورو، طلا، سکه و رمزارز به تومان و تبدیل مبلغ'
    startup: false
    chatMenu: true
    timeout: 60000
    initTimeout: 15000
  dadras:
    type: streamable-http
    url: 'https://mcp.dadrasai.com/mcp'
    title: 'دادرس'
    description: 'قوانین و مقررات ایران، واژه‌نامه حقوقی و ماشین‌حساب مهریه، دیه، ارث و هزینه دادرسی'
    startup: false
    chatMenu: true
    timeout: 60000
    initTimeout: 15000
  zarinpal-docs:
    type: streamable-http
    url: 'https://www.zarinpal.com/docs/mcp'
    title: 'مستندات زرین‌پال'
    description: 'جستجو و خواندن مستندات رسمی درگاه پرداخت زرین‌پال و توضیح کدهای خطا'
    startup: false
    chatMenu: true
    timeout: 60000
    initTimeout: 15000
  pasavard:
    type: streamable-http
    url: 'https://pasavard.ir/api/mcp'
    title: 'پس‌آورد'
    description: 'پیدا کردن کالای واقعاً ارزان در دیجی‌کالا و اسنپ‌شاپ با لینک خرید و کش‌بک'
    startup: false
    chatMenu: true
    timeout: 60000
    initTimeout: 15000
  vibefarsi:
    type: streamable-http
    url: 'https://vibefarsi.ir/mcp'
    title: 'وایب‌فارسی'
    description: 'قواعد طراحی و کامپوننت‌های آماده برای رابط فارسی و راست‌به‌چپ با React و Tailwind'
    startup: false
    chatMenu: true
    timeout: 60000
    initTimeout: 15000
  # Official ArvanCloud MCP — each user supplies a Machine User API key.
  # Header value is typically `apikey <uuid>` from the Arvan panel.
  arvancloud:
    type: streamable-http
    url: 'https://mcp.arvancloud.ir/mcp'
    title: 'ابر آروان'
    description: 'مدیریت CDN، DNS، سرور، فضای ذخیره‌سازی و سرویس‌های ابر آروان با کلید Machine User خودتان'
    startup: false
    chatMenu: true
    timeout: 120000
    initTimeout: 30000
    apiKey:
      source: user
      authorization_type: custom
      custom_header: 'Arvancloud-Api-Key'
    serverInstructions: |
      ArvanCloud MCP manages the user's own Arvan Cloud account (CDN, DNS, IaaS, storage,
      and related services). Require the user to have configured their Machine User API key
      first. Prefer read-only inspection unless the user clearly asks to change or delete
      resources. Before any create, update, delete, power-cycle, purge, or paid action, confirm
      in Persian what will change and wait for approval. Never invent API keys or account IDs.
  # Users' own sites, through the internal `sitemcp` service (deploy/site-mcp). Each user enters
  # their own values once (stored encrypted); the service gets them per request, reaches public
  # addresses only, follows no redirects and stores nothing. SITE_MCP_TOKEN lets only this api
  # call it.
  # WordPress: the user's site runs the official «MCP Adapter» plugin (WordPress 6.9+); the user
  # enters the site address, their WordPress username and an application password, and works
  # with that account's own WordPress permissions.
  wordpress:
    type: streamable-http
    url: 'http://sitemcp:3200/wordpress/mcp'
    title: 'وردپرس'
    description: 'کار با سایت وردپرس خودتان (افزونه رسمی MCP Adapter) با رمز برنامه حساب وردپرس خودتان'
    setupHelp: |
      پیش از اتصال، یک بار این کارها را روی سایت وردپرس خودتان انجام دهید:
      ۱. وردپرس باید نسخه ۶.۹ یا بالاتر باشد (پیشخوان ← به‌روزرسانی‌ها).
      ۲. افزونه «MCP Adapter» را نصب و فعال کنید: پیشخوان ← افزونه‌ها ← افزودن ← جستجوی «MCP Adapter».
      ۳. یک رمز برنامه بسازید: پیشخوان ← کاربران ← نمایه ← بخش «رمزهای برنامه» (Application Passwords) ← یک نام مثل HiveGPT بنویسید و «افزودن» را بزنید. رمز ۲۴ حرفی که نشان داده می‌شود را کپی کنید؛ دوباره نشان داده نمی‌شود.
      ۴. سایت باید با https باز شود. اگر بخش «رمزهای برنامه» را نمی‌بینید، معمولاً سایت https ندارد یا یک افزونه امنیتی آن را بسته است.

      بعد در کادرهای زیر آدرس سایت (مثل https://example.com)، نام کاربری وردپرس و همان رمز برنامه را وارد کنید. رمز ورود اصلی خود را وارد نکنید.
      دستیار با دسترسی همان حساب وردپرس کار می‌کند؛ برای امنیت بیشتر می‌توانید یک کاربر با نقش «ویرایشگر» بسازید و رمز برنامه را برای او بگیرید. هر وقت خواستید، همان رمز برنامه را در نمایه وردپرس باطل کنید.
      کارهایی که از چت ممکن است به قابلیت‌هایی بستگی دارد که وردپرس و افزونه‌های سایت (مثل WooCommerce) ارائه می‌کنند.
    startup: false
    chatMenu: true
    timeout: 120000
    initTimeout: 30000
    headers:
      X-Site-Mcp-Token: '${SITE_MCP_TOKEN}'
      X-Wordpress-Url: '{{WORDPRESS_SITE_URL}}'
      X-Wordpress-Username: '{{WORDPRESS_USERNAME}}'
      X-Wordpress-App-Password: '{{WORDPRESS_APP_PASSWORD}}'
    customUserVars:
      WORDPRESS_SITE_URL:
        title: 'آدرس سایت'
        description: 'مثل https://example.com (فقط https). افزونه «MCP Adapter» باید روی سایت نصب و فعال باشد.'
        sensitive: false
      WORDPRESS_USERNAME:
        title: 'نام کاربری وردپرس'
        description: 'نام کاربری حسابی که با آن وارد پیشخوان وردپرس می‌شوید.'
        sensitive: false
      WORDPRESS_APP_PASSWORD:
        title: 'رمز برنامه (Application Password)'
        description: 'در پیشخوان وردپرس: کاربران ← نمایه ← رمزهای برنامه؛ یک رمز بسازید و اینجا بگذارید. رمز ورود اصلی را وارد نکنید.'
    serverInstructions: |
      This is the user's own WordPress site, through its MCP Adapter plugin, acting as the user's
      own WordPress account. Discover the available abilities first. Read before you change
      anything. Before publishing, editing or deleting, show in Persian exactly what will change
      and wait for the user's approval. Never invent content, passwords or IDs.
  # cPanel: a curated set of the cPanel API (account, domains, DNS read, email accounts, files,
  # SSL, backups). No cron, SSH keys, API tokens or Git deploy, since those can run code on the
  # host or take the account over. Every change needs the user's confirmation.
  cpanel:
    type: streamable-http
    url: 'http://sitemcp:3200/cpanel/mcp'
    title: 'cPanel'
    description: 'مدیریت هاست cPanel خودتان: دامنه‌ها، ایمیل‌ها، فایل‌ها، DNS، SSL و بکاپ با توکن API خودتان'
    setupHelp: |
      پیش از اتصال یک توکن API در cPanel بسازید:
      ۱. وارد cPanel شوید (معمولاً https://دامنه-شما:2083).
      ۲. بخش Security ← Manage API Tokens ← Create را بزنید، یک نام مثل HiveGPT بدهید و اگر خواستید تاریخ انقضا بگذارید.
      ۳. توکن ساخته‌شده را کپی کنید؛ دوباره نشان داده نمی‌شود.

      بعد در کادرهای زیر آدرس cPanel با https و پورت ۲۰۸۳ (مثل https://example.com:2083)، نام کاربری هاست و توکن را وارد کنید.
      دستیار می‌تواند حساب را بخواند (دامنه‌ها، ایمیل‌ها، فایل‌ها، DNS، SSL، دیتابیس‌ها و بکاپ‌ها) و چند کار مشخص انجام دهد: ساختن، تغییر رمز و حذف ایمیل، ذخیره فایل، تمدید SSL و گرفتن بکاپ. هر تغییر فقط بعد از تأیید صریح شما انجام می‌شود. کار با cron، کلید SSH و Git deploy عمداً در دسترس نیست.
      هر وقت خواستید، توکن را از همان صفحه Manage API Tokens باطل کنید.
    startup: false
    chatMenu: true
    timeout: 120000
    initTimeout: 30000
    headers:
      X-Site-Mcp-Token: '${SITE_MCP_TOKEN}'
      X-Cpanel-Url: '{{CPANEL_URL}}'
      X-Cpanel-Username: '{{CPANEL_USERNAME}}'
      X-Cpanel-Token: '{{CPANEL_API_TOKEN}}'
    customUserVars:
      CPANEL_URL:
        title: 'آدرس cPanel'
        description: 'مثل https://example.com:2083 (همان آدرسی که با آن وارد cPanel می‌شوید، با https و پورت ۲۰۸۳).'
        sensitive: false
      CPANEL_USERNAME:
        title: 'نام کاربری cPanel'
        description: 'نام کاربری حساب هاست.'
        sensitive: false
      CPANEL_API_TOKEN:
        title: 'توکن API ‏cPanel'
        description: 'در cPanel: Security ← Manage API Tokens ← Create؛ توکن ساخته‌شده را اینجا بگذارید.'
    serverInstructions: |
      This is the user's own cPanel hosting account. Read before you change anything. Every
      change needs confirm: true, which you may set only after showing in Persian exactly what
      will change and getting the user's explicit approval. Never invent passwords, domains or
      file contents; ask for them.
  # «سامانه ویک سیگنال» (WeakSignal, code name NewsWatch): each user connects their own account, read only, with a personal
  # token they create in NewsWatch (Settings → Account → API tokens). The NewsWatch address is
  # NEWSWATCH_MCP_URL on the `sitemcp` service; unset, the tools say it is not set up.
  newswatch:
    type: streamable-http
    url: 'http://sitemcp:3200/newswatch/mcp'
    title: 'سامانه ویک سیگنال'
    description: 'جستجو و پایش خبر در حساب سامانه ویک سیگنال خودتان (فقط خواندنی): آخرین خبرها، جستجو، خوشه‌ها و سیگنال‌های ضعیف'
    setupHelp: |
      برای اتصال یک توکن شخصی در سامانه ویک سیگنال بسازید:
      ۱. وارد سامانه ویک سیگنال شوید و به تنظیمات ← حساب کاربری ← «توکن‌های API» بروید.
      ۲. یک نام مثل HiveGPT بدهید، مدت اعتبار را انتخاب کنید و توکن را بسازید.
      ۳. توکن (که با nwt_ شروع می‌شود) را کپی کنید؛ دوباره نشان داده نمی‌شود.

      بعد توکن را در کادر زیر وارد کنید. دسترسی فقط خواندنی است و همان بخش‌ها و پنل‌هایی را می‌بیند که حساب شما در سامانه ویک سیگنال دارد. با تغییر رمز سامانه ویک سیگنال یا باطل کردن توکن در همان صفحه، اتصال قطع می‌شود.
    startup: false
    chatMenu: true
    timeout: 120000
    initTimeout: 30000
    headers:
      X-Site-Mcp-Token: '${SITE_MCP_TOKEN}'
      X-Newswatch-Token: '{{NEWSWATCH_TOKEN}}'
    customUserVars:
      NEWSWATCH_TOKEN:
        title: 'توکن API سامانه ویک سیگنال'
        description: 'در سامانه ویک سیگنال: تنظیمات ← حساب کاربری ← توکن‌های API؛ یک توکن بسازید (با nwt_ شروع می‌شود) و اینجا بگذارید.'
    serverInstructions: |
      WeakSignal («سامانه ویک سیگنال», code name NewsWatch) reads news from the user's own
      account, read only, with that account's
      own sections and panels. Use latest_news or search_news for simple questions,
      advanced_search or semantic_search for research, similar_articles and list_clusters /
      cluster_timeline for how a story spread, and weak_signals for emerging topics. Pass
      workspace "persian" for Persian-language media. Cite every item with its title, source,
      date and link, and answer in Persian. Call the system «سامانه ویک سیگنال».

# Image, video and speech generation. Tools attach only when the user opts in from the
# composer's «ساختن» rows (`ephemeralAgent.media`); bare chats do not pay the schema cost.
# Charged to the user's HiveGPT credit: the estimate is held first, the real provider cost x
# the endpoint's priceMultiplier is charged after, and a failed generation costs nothing. Only
# users with a pack (bought or granted) may generate; others are told how to unlock it. An
# admin can switch it on or off per user («رسانه» in the users list). Confidential and local
# chats never get these tools.
mediaGeneration:
  enabled: true
  paidOnly: true
  endpoint: 'OpenRouter'
  image:
    # The model for a user who never picked one. Users pick any model from OpenRouter's image
    # catalogue (`catalogue`, refreshed every `refreshHours`); the model never switches on its own.
    model: 'openai/gpt-image-2'
    catalogue: true
    refreshHours: 6
    # Offered first when the user wants Persian text in the picture.
    persianText:
      - 'openai/gpt-image-2*'
      - 'google/gemini-*-image*'
      - 'google/gemini-nano-banana-*'
    exclude: []
    # Held before a picture (the real cost is charged after). Models not listed here hold their
    # per-token catalogue price x estimateTokens, else estimateUsd.
    estimates:
      'google/gemini-3.1-flash-image': 0.08 # Nano Banana 2
    estimateTokens: 2000
    estimateUsd: 0.08
  video:
    model: 'google/veo-3.1-lite' # 4, 6 or 8 seconds, with audio
    resolution: '720p'
    defaultDuration: 4
    maxDuration: 8
    estimateUsdPerSecond: 0.25
    # Runs in the background: the chat shows a card that becomes the player when the job ends,
    # so a closed page or a dropped stream loses nothing; charged only when the file arrives.
  speech:
    model: 'google/gemini-3.8-flash-tts'
    voice: 'Kore'
    voices: ['Charon', 'Leda', 'Puck']
    format: 'pcm' # Gemini TTS returns PCM only; saved as WAV
    instructions: 'Speak naturally and clearly in the language of the text, with a warm tone.'
    estimateUsd: 0.03
  # Higgsfield's own API (https://console.higgsfield.ai): a separate option from the MCP server
  # above, paid from the deployment's Higgsfield balance and charged to users at `priceUsd`
  # (set it to Higgsfield's list price, times your markup). Off until both keys are set.
  higgsfield:
    apiKeyId: '${HIGGSFIELD_API_KEY_ID}'
    apiKeySecret: '${HIGGSFIELD_API_KEY_SECRET}'
    models:
      - id: 'higgsfield-ai/soul/v2/standard'
        kind: 'image'
        label: 'SOUL V2'
        description: 'Fashion and portrait photos with a strong style'
        priceUsd: 0.12

memory:
  personalize: true
  messageWindowSize: 5
  tokenLimit: 2000
  validKeys: ['profile', 'preferences', 'work', 'goals', 'context']
  excludeEndpoints: ['Local', 'LocalUncensored', 'LocalUncensoredThink', 'LocalCoder']
  excludeEndpointsRead: true
  learnFromFeedback: true
  agent:
    enabled: true
    provider: 'OpenRouterPrivate'
    model: 'google/gemini-3.8-flash'
    model_parameters:
      temperature: 0.1
    instructions: |
      You maintain long-term memory about the user for future conversations.
      Save only stable, useful facts the user stated about themselves: name, language and tone
      they prefer, job and field, ongoing projects and goals, recurring constraints.
      Also save anything the user explicitly asks you to remember, and delete what they ask
      you to forget.
      Never save: one-off questions, content of documents, passwords, keys, health, financial or
      other sensitive data, or guesses about the user.
      Update an existing key instead of adding a duplicate. Keep each value short.
      Lines in `preferences` that start with `- Disliked (` or `- Liked (` come from the user's
      feedback on answers: keep them when you rewrite that key, and follow them.
      Write values in the language the user uses.
      VALID KEYS: profile, preferences, work, goals, context
      TOKEN LIMIT: Maximum 2000 tokens across all memory values.
      If nothing in the latest messages is worth remembering, end the turn without any tool call.

# Deterministic Persian date and spelling tools (`persian_calendar`, `persian_normalize`).
# Ordinary chats get them only when the user opts in (Persian skill / `ephemeralAgent.persian`).
# The fixed Solar Hijri holidays are built in. The lunar ones move every year with the moon
# sighting, so add each year's official list here once it is published, one entry per day with
# the Solar Hijri date in Latin digits:
#   holidays:
#     - { date: 'YYYY-MM-DD', title: 'عنوان تعطیلی' }
persianTools:
  chat: true
  timezone: 'Asia/Tehran'
  holidays: []

# The article wizard and the slide builder (experimental): tools attach when the user picks the
# «ساختن» rows (`ephemeralAgent.office` / staged skills), not on every bare chat. Files are built
# on this server; confidential and local models do not get them. The composer's `+` menu follows
# `word` and `slides`; the skills «ویزارد مقاله» and «ساخت پاورپوینت» carry the step-by-step flow.
officeTools:
  word: true
  slides: true
  maxSlides: 40
  maxImages: 20
  embedFonts: true

# Clip builder («کلیپ‌ساز», create_remotion_clip): storyboard motion graphics rendered in the
# background on the `remotion` service. Scene types, themes and limits: skill/clip-builder and
# docs/saas/clip-builder-fa.md. AI images are opt-in and charged like the image tool; stock
# photos need PEXELS_API_KEY on the api.
clipTools:
  clip: true
  maxDurationSec: 90
  height: 720
  maxScenes: 20
  maxJobsPerUser: 1
  renderTimeoutSec: 600
  queueTimeoutSec: 900
  preview: true
  captions: true
  music: true
  aiImages: false
  maxAiImages: 3
  stockImages: true
  maxStockImages: 6
  maxConcurrent: 1

# Agent browser (experimental): the `browser` service in docker-compose.yml. Who may open one is
# set per pack and per user in the admin panel (admins always may); these are the server limits.
browser:
  enabled: true
  # Browsers open at once on the whole server
  maxSessions: 10
  # A browser closes after this many minutes without a step, and after maxMinutes in any case
  idleMinutes: 3
  maxMinutes: 20
  # New browsers are refused at or above these: host and browser-container RAM, host CPU over
  # the last minute. Users then see «ظرفیت فعلاً وجود ندارد، با پشتیبانی تماس بگیرید».
  capacity:
    ram: 85
    cpu: 90
  # Days the admin's browser log keeps an entry
  logDays: 90

webSearch:
  # Paid Google results first; when one provider's plan runs out (or it rejects its key) the
  # next answers, and the free self-hosted SearXNG is the last resort. Providers without a key
  # are skipped. The admin page («وضعیت سرویس‌ها») shows each one's remaining credit.
  providerChain: ['serper', 'serpapi', 'tavily', 'searxng']
  serpapiApiKey: '${SERPAPI_API_KEY}'
  providerFailover:
    exhaustedCooldownSeconds: 3600
    rateLimitCooldownSeconds: 60
    unauthorizedCooldownSeconds: 3600
    timeoutMs: 10000
    serpapiHl: 'fa'
    serpapiGl: 'ir'
  # Self-hosted SearXNG for results, Keenable (keyless) to read pages, no reranker.
  searchProvider: searxng
  searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
  # Keenable works without a key; set KEENABLE_API_KEY to lift its public rate limit.
  scraperProvider: keenable
  # Reranker left unpinned on purpose: Jina is used when JINA_API_KEY is set, else Cohere
  # when COHERE_API_KEY is set, else no reranking. Pinning `rerankerType: jina` without a
  # key would disable web search entirely.
  jinaApiKey: '${JINA_API_KEY}'
  cohereApiKey: '${COHERE_API_KEY}'
  searxngSearchOptions:
    engines:
      - google
      - bing
      - brave
      - startpage
      - wikipedia
  # The internal SearXNG container is a private address; exempt exactly that host:port.
  allowedAddresses:
    - 'searxng:8080'

# Upload limits, in MB (upstream default: 512 MB per file). Custom endpoints (OpenRouter…) use
# the `agents` entry. Allowed file types stay at the defaults.
fileConfig:
  serverFileSizeLimit: 50
  avatarSizeLimit: 2
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 100
    agents:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 100

# Text extraction for PDFs and images (file search, and models that cannot read images).
# PDF pages with a usable text layer are read for free; only scanned or garbled pages are OCR'd,
# through the route that matches the conversation:
#   public  -> vision model on the regular OpenRouter endpoint
#   private -> the same model on OpenRouterPrivate, whose addParams enforce zero data retention
#   local   -> Tesseract on this server; the document never leaves the machine
# Pricing: vision OCR is billed at the model's real token price x the endpoint's priceMultiplier,
# exactly like chat. Local OCR is billed per page from server cost: EUR 80/month ~ $93 x 70% local
# share / busy seconds (30% of a month) ~ $0.0000825/s x ~3 s/page (Tesseract fas, 200 DPI, one
# core) ~ $0.00025/page. Keep the model ids concrete (gemini-3.8-flash has ZDR endpoints) so the
# price lookup works.
documentOcr:
  enabled: true
  maxPages: 100
  concurrency: 4
  dpi: 200
  maxSide: 2000
  # Which route a conversation uses: specs with `privacy: 'local'`/`'private'` and these endpoints
  # (the stricter wins; a stored conversation can only become stricter, never public).
  localEndpoints: ['Local', 'LocalUncensored', 'LocalUncensoredThink', 'LocalCoder']
  privateEndpoints: ['OpenRouterPrivate']
  public:
    endpoint: 'OpenRouter'
    model: 'google/gemini-3.8-flash'
  private:
    endpoint: 'OpenRouterPrivate'
    model: 'google/gemini-3.8-flash'
  local:
    engine: 'tesseract'
    languages: 'fas+eng'
    pricePerPage: 0.00025
  timeoutMs: 120000
speech:
  # Server speech (STT/TTS) through OpenRouter's OpenAI-compatible /audio/* API, billed like chat:
  # credits = provider cost (OpenRouter usage.cost / generation total_cost) x the endpoint's
  # priceMultiplier x 1,000,000. Local chats (localEndpoints / spec privacy: local) never send audio
  # or text out: the client uses browser speech for them and the server refuses (409 local_route).
  # Private chats (privateEndpoints / spec privacy: private) use `private` with provider.zdr: true.
  stt:
    hive:
      public:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.5-transcribe' # $2/M audio-in, $12/M out (~$0.004/min)
      private:
        endpoint: 'OpenRouterPrivate'
        model: 'elevenlabs/scribe-v2' # ZDR on OpenRouter, 90+ langs incl. Persian (~$0.0037/min)
      language: 'fa'
      maxBytes: 10485760 # 10 MB upload cap
      maxDurationSeconds: 120 # client auto-stops the recording here
      timeoutMs: 60000
      estimateUsdPerMinute: 0.01 # balance hold / charge when no cost is reported
  tts:
    maxInputChars: 4096
    hive:
      public:
        endpoint: 'OpenRouter'
        model: 'google/gemini-3.8-flash-tts' # Gemini TTS supports fa-IR; ZDR on Google (Vertex)
      private:
        endpoint: 'OpenRouterPrivate'
        model: 'google/gemini-3.8-flash-tts'
      voices: ['Kore', 'Charon', 'Leda', 'Puck'] # first = default
      instructions: 'Read aloud in natural, clear Persian (Farsi) with a warm, conversational tone.'
      responseFormat: 'pcm' # Gemini TTS returns PCM only; served as WAV
      pcmSampleRate: 24000
      chunkChars: 1500
      timeoutMs: 60000
      estimateUsdPerMinute: 0.02
      costLookupAttempts: 4
      costLookupDelayMs: 750
  speechTab:
    speechToText:
      languageSTT: 'fa-IR'
    textToSpeech:
      languageTTS: 'fa-IR'

# In-app pack purchase. A gateway is offered once its key is set; the amount is always computed
# on the server from the pack's Toman price, and a payment credits the account exactly once.
# Invite rewards. Each user has a link (account menu → «دعوت از دوستان», or Settings → Account):
# when someone signs up through it and verifies a mobile number, the inviter gets
# `referrerCredits` and the new account `inviteeCredits` on top of its start balance, once.
# 1,000,000 credits = $1 at list price. A mobile is unique per account, so throwaway emails
# cannot farm rewards; an inviter is paid for at most `maxRewardsPerReferrer` invites.
referral:
  enabled: true
  referrerCredits: 500000
  inviteeCredits: 200000
  maxRewardsPerReferrer: 20
  claimWindowDays: 7
  requirePhone: true

payments:
  enabled: true
  orderTtlMinutes: 30
  requestTimeoutMs: 15000
  description: 'خرید {pack} در HiveGPT'
  gateways:
    zarinpal:
      enabled: true
      merchantId: '${ZARINPAL_MERCHANT_ID}'
      sandbox: false
      currency: 'IRR'
    idpay:
      enabled: true
      apiKey: '${IDPAY_API_KEY}'
      sandbox: false

# Admin «وضعیت سرویس‌ها»: credit and health of OpenRouter, the search providers, Kavenegar,
# the payment gateways, SearXNG and the local model, refreshed in the background.
serviceStatus:
  refreshIntervalSeconds: 600
  warningPercent: 20
  warningDays: 7
  historyDays: 30
  ollamaUrl: 'http://ollama:11434'

endpoints:
  agents:
    capabilities:
      - deferred_tools
      - file_search
      - web_search
      - artifacts
      - context
      - tools
      - memory
      - skills
      # The question form: the model asks its clarifying questions in a form in the chat.
      - ask_user_question
      # Required so Agent Builder shows «اجرای کد» and runtime can load code tools.
      # MicroVM codeapi is still off; execution goes to the Attached VM bridge.
      - execute_code
      # Attached / personal VMs (@librechat/code). Experimental; see docs/saas/ATTACHED_VM.md.
      - stateful_code_sessions
    # Sharing scopes for stateful workspaces. personal-workers is a pairing control
    # plane, not an execution default: a pairing-only environment with default: true
    # fails config validation and the api process will not start.
    statefulCodeSessions:
      allowedEnvironments:
        - user
        - agent-user
        - conversation
      allowEnvironmentSelection: true
      # Lets a sealed chat leave a dead Attached VM (Continue without workspace) and move
      # onto another machine. Without this, the composer only shows «Workspace unavailable»
      # + refresh and send stays blocked.
      conversationMoves:
        enabled: true
        allowAttachDetach: true
      principalWorkers:
        enabled: true
        maxPerUser: 2
      environments:
        - id: personal-workers
          name: ماشین شخصی (Attached VM)
          type: attached
          # Public HTTPS origin of codeapi_bridge (include /v1). Must be a real
          # URL at config load: Zod validates before runtime, and Coolify may omit
          # LIBRECHAT_CODE_BRIDGE_BASEURL from the api container even when compose
          # declares a default. Pairing CLI / docs still read that env var.
          baseURL: 'https://code.aichat.hivelink.co/v1'
          owner: deployment
          configSchema:
            limits:
              maxCommandTimeoutMs: 120000
            permissions:
              fileWrite:
                allowed: [allow, ask, deny]
                default: ask
              commandExecution:
                allowed: [allow, ask, deny]
                default: ask
          pairing:
            allowPrincipalWorkers: true
            tokenEnv: CODE_BRIDGE_ADMIN_TOKEN
  custom:
    # The name must stay "OpenRouter": live per-model pricing is fetched only for that name.
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default: ['~google/gemini-flash-latest']
        # Required: fetching the model list is what loads OpenRouter's USD prices.
        fetch: true
      # Users pay OpenRouter's price x 1.3 (30% margin). Change and redeploy to reprice.
      priceMultiplier: 1.3
      titleConvo: true
      titleModel: '~google/gemini-flash-latest'
      # OpenRouter models use a variety of stop tokens.
      dropParams: ['stop']
      # PDFs go to the model only when it reads files natively. Without this, OpenRouter OCRs
      # them with paid "mistral-ocr" (billed to our account, not ZDR); models without file
      # input get their PDFs through our own OCR instead.
      addParams:
        plugins:
          - id: 'file-parser'
            pdf:
              engine: 'native'
      # Users never see the host's name: errors and icon labels say HiveGPT, and icons show
      # each model's maker (Claude, GPT, Gemini…) from the model id.
      modelDisplayLabel: 'HiveGPT'
      # Do not add `headers` here: they make the price cache per-user (one fetch per user).

    # Confidential chats: same OpenRouter account, but every request asks OpenRouter to route
    # only to Zero-Data-Retention endpoints of providers that do not collect data. Requests fail
    # rather than fall back when no such endpoint is available. Prices are fetched live (the
    # base URL identifies OpenRouter) and marked up like the main endpoint.
    # Unlimited Claude plan only. Dedicated Anthropic Messages gateway (host in CLAUDE_TIME_*).
    # Set CLAUDE_TIME_KEY and CLAUDE_TIME_BASE_URL in Coolify. Base URL is the SDK host
    # without /v1 (the Anthropic client appends /v1/messages). Never expose the host to users.
    - name: 'ClaudeTime'
      provider: 'anthropic'
      apiKey: '${CLAUDE_TIME_KEY}'
      baseURL: '${CLAUDE_TIME_BASE_URL}'
      models:
        default:
          - 'claude-sonnet-5-5'
          - 'claude-opus-5-5'
          - 'claude-fable-5-2'
          - 'claude-mythos-5-2'
        fetch: false
      titleConvo: true
      titleModel: 'claude-sonnet-5-5'
      modelDisplayLabel: 'Claude'
      # Metering rates for fairness (credits equivalent); time path does not charge tokenCredits.
      # `context` is required by configSchema — missing it exits the api process (Coolify restart loop).
      priceMultiplier: 1
      tokenConfig:
        'claude-sonnet-5-5':
          prompt: 3
          completion: 15
          context: 1000000
        'claude-opus-5-5':
          prompt: 15
          completion: 75
          context: 1000000
        'claude-fable-5-2':
          prompt: 5
          completion: 25
          context: 1000000
        'claude-mythos-5-2':
          prompt: 10
          completion: 50
          context: 1000000

    - name: 'OpenRouterPrivate'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        # Concrete ids: the ~…-latest aliases have no ZDR endpoints.
        default: ['google/gemini-3.8-flash']
        fetch: true
      addParams:
        provider:
          zdr: true
          data_collection: 'deny'
        # Never let OpenRouter OCR PDFs with Mistral (not ZDR); see the endpoint above.
        plugins:
          - id: 'file-parser'
            pdf:
              engine: 'native'
      priceMultiplier: 1.3
      titleConvo: true
      titleModel: 'google/gemini-3.8-flash'
      dropParams: ['stop']
      modelDisplayLabel: 'محرمانه'

    # Internal model served by the `ollama` container: nothing leaves the server.
    # Slow on CPU and much weaker than cloud models.
    #
    # Local prices recover the server's cost (docs/saas/BILLING.md, «قیمت مدل‌های لوکال»):
    #   server ≈ €80/month ≈ $93; 70% of it is charged to the local models ($65) and spread
    #   over the hours the model is busy (30% of the month ≈ 219 h), i.e. $0.0000825 per
    #   busy second. A token costs that divided by the model's speed on this CPU
    #   (Ryzen 9 3900, 12 threads), in USD per 1M tokens:
    #     gemma3:4b             ~100 tok/s reading, ~15 tok/s writing → 0.8 / 5.5
    #     Qwen 3.6 35B (3B act.) ~50 tok/s reading, ~10 tok/s writing → 1.6 / 8
    #     Qwen2.5-Coder 32B dense ~20 tok/s reading, ~4 tok/s writing → 4 / 20 (estimate)
    #   A stronger model is slower per token, so it costs more. Thinking tokens bill as output,
    #   so the "think" spec costs more per answer at the same rate. Re-measure the speeds
    #   (`ollama run --verbose`) and scale these numbers when the server or models change.
    - name: 'Local'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1'
      models:
        # Built by the ollama container from LOCAL_MODEL (gemma3:4b) with the thread count
        # and context set; see docker-compose.yml.
        default: ['hivegpt-local']
        fetch: false
      tokenConfig:
        'hivegpt-local':
          prompt: 0.8
          completion: 5.5
          context: 8192
      # A title would be a second slow local call; chats keep the default title.
      titleConvo: false
      modelDisplayLabel: 'داخلی'
      iconURL: '/assets/logo.svg'

    # Admin-only: Qwen 3.6 35B (3B active) with its refusals removed (abliterated), also on the
    # `ollama` container. Two endpoints so one spec answers at once and the other thinks first:
    # Ollama turns thinking off for `reasoning_effort: none`. Only the admin-only specs below
    # use them; users' requests must name a spec they have, so they cannot reach these.
    - name: 'LocalUncensored'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1'
      models:
        default: ['hivegpt-uncensored']
        fetch: false
      addParams:
        reasoning_effort: 'none'
      tokenConfig:
        'hivegpt-uncensored':
          prompt: 1.6
          completion: 8
          context: 16384
      titleConvo: false
      modelDisplayLabel: 'بدون سانسور'
      iconURL: '/assets/logo.svg'
    - name: 'LocalUncensoredThink'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1'
      models:
        default: ['hivegpt-uncensored']
        fetch: false
      tokenConfig:
        'hivegpt-uncensored':
          prompt: 1.6
          completion: 8
          context: 16384
      titleConvo: false
      modelDisplayLabel: 'بدون سانسور — فکر عمیق'
      iconURL: '/assets/logo.svg'

    # Admin-only coding model beside the general uncensored Qwen (not a replacement).
    # Dense 32B is slower on CPU than the MoE uncensored model; use for code, not general chat.
    - name: 'LocalCoder'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1'
      models:
        default: ['hivegpt-coder']
        fetch: false
      tokenConfig:
        'hivegpt-coder':
          prompt: 4
          completion: 20
          context: 16384
      titleConvo: false
      modelDisplayLabel: 'کدنویسی لوکال'
      iconURL: '/assets/logo.svg'

modelSpecs:
  enforce: true
  prioritize: true
  # One-click model buttons on the empty-chat landing (above the composer). Each `id` maps to
  # `com_ui_model_quick_{id}` in the UI; `specs` are `list[].name` values in display order.
  # Specs the user cannot access are skipped; an empty resolved row is omitted.
  quickPicks:
    - id: strongest
      specs: [claude-fable, gpt-astra]
    - id: daily
      specs: [economy, fast]
  # New models appear on their own. The server reads OpenRouter's catalogue (/models) and its
  # Zero-Data-Retention list (/endpoints/zdr) at startup and every `refreshHours`, in the
  # background (requests never wait on it; a failed read keeps the last one), and adds:
  # - public specs: every `~{provider}/{family}-latest` alias of a provider below that no spec
  #   in `list` already uses, named `auto-{provider}-{family}`, after that brand's specs;
  # - confidential specs (CONFIDENTIAL RULE: only concrete model ids that are on the ZDR list —
  #   never an alias, never a model without a ZDR endpoint): `auto-private-{family}` for each
  #   family below that has no private spec yet. Private specs in `list` move to the newest ZDR
  #   version of their family, and one whose model leaves the ZDR list is removed. Until the
  #   ZDR list has been read once, private specs are served exactly as written here.
  # Role/user access to private specs applies to discovered ones too. To hide a discovered
  # model, add its id (alias or concrete) to `exclude`; specs written in `list` always win.
  autoDiscover:
    enabled: true
    endpoint: 'OpenRouter'
    privateEndpoint: 'OpenRouterPrivate'
    refreshHours: 6
    # New brand groups go before the tools group.
    insertBeforeGroup: 'ابزارها'
    # OpenRouter provider prefix → menu group and icon.
    providers:
      anthropic: { group: 'Claude', icon: 'anthropic' }
      openai: { group: 'ChatGPT', icon: 'openai' }
      google: { group: 'Gemini', icon: 'google' }
      deepseek: { group: 'DeepSeek', icon: 'deepseek' }
      x-ai: { group: 'Grok', icon: 'xai' }
      z-ai: { group: 'GLM', icon: 'zhipu' }
      qwen: { group: 'Qwen', icon: 'qwen' }
      moonshotai: { group: 'Kimi', icon: 'moonshot' }
    # A provider not listed above still gets its `-latest` models, in a group named after it
    # (as OpenRouter writes it), after the listed groups: a new AI company shows up without a
    # config change. New specs carry their publish date and read «جدید» in the menu for two
    # weeks, with their price. Such a group uses the company's built-in icon when there is one
    # (Mistral, Cohere…), else `otherProvidersIcon` (default `/assets/ai-provider.svg`).
    otherProviders: true
    # Older families that would duplicate a menu entry: GPT Mini (ChatGPT Mini is GPT Luna) and
    # DeepSeek V4 Flash (DeepSeek Flash follows the newest Flash).
    exclude:
      - '~openai/gpt-mini-latest'
      - '~deepseek/deepseek-v4-flash-latest'
    private:
      enabled: true
      groupIcon: '/assets/private.svg'
      # Model families offered as confidential (a concrete id's name without its version:
      # anthropic/claude-sonnet-5.5 → claude-sonnet, openai/gpt-6.1-sol → gpt-sol).
      families:
        - 'claude-sonnet'
        - 'claude-opus'
        - 'claude-haiku'
        - 'gpt-sol'
        - 'gpt-luna'
        - 'gpt-astra'
        - 'gemini-flash'
        - 'gemini-pro'
        - 'gemini-argon'
  # Grouped by AI brand in this order; every spec names its own icon (`iconURL`), so no host
  # name or logo reaches users. Spec names of earlier versions (fast, smart, gpt, economy, pro,
  # research, perplexity, documents, private-*, local) are kept so old chats continue.
  # `~…-latest` ids follow each brand's newest model on OpenRouter.
  # No spec is marked `default`/`softDefault` on purpose: a user who never picked a model
  # starts with an empty selector and must choose one before sending (their last pick is
  # remembered for later new chats).
  list:
    # --- Claude (credit path via OpenRouter; hidden while a time pack is active) ---
    - name: 'smart'
      label: 'Claude Sonnet'
      description: 'دقیق و متعادل؛ برای نوشتن، تحلیل و کدنویسی'
      group: 'Claude'
      groupIcon: 'anthropic'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-sonnet-latest'
        modelLabel: 'Claude Sonnet'
    - name: 'pro'
      label: 'Claude Opus'
      description: 'قوی‌ترین Claude برای کارهای پیچیده؛ مصرف بیشتری دارد'
      group: 'Claude'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-opus-latest'
        modelLabel: 'Claude Opus'
    - name: 'claude-fable'
      label: 'Claude Fable'
      description: 'قوی‌ترین مدل Anthropic، یک رده بالاتر از Opus؛ برای سخت‌ترین کارها. گران‌ترین Claude'
      group: 'Claude'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-fable-latest'
        modelLabel: 'Claude Fable'
    - name: 'claude-haiku'
      label: 'Claude Haiku'
      description: 'سریع و کم‌هزینه'
      group: 'Claude'
      iconURL: 'anthropic'
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-haiku-latest'
        modelLabel: 'Claude Haiku'
    # --- Unlimited Claude plan (dedicated API; only with an active time entitlement) ---
    - name: 'time-smart'
      label: 'Claude Sonnet 5.5'
      description: 'پلن نامحدود؛ دقیق و متعادل'
      group: 'Claude'
      groupIcon: 'anthropic'
      iconURL: 'anthropic'
      timePack: true
      preset:
        endpoint: 'ClaudeTime'
        model: 'claude-sonnet-5-5'
        modelLabel: 'Claude Sonnet 5.5'
        thinking: true
        effort: high
    - name: 'time-pro'
      label: 'Claude Opus 5.5'
      description: 'پلن نامحدود؛ قوی‌ترین Claude'
      group: 'Claude'
      iconURL: 'anthropic'
      timePack: true
      preset:
        endpoint: 'ClaudeTime'
        model: 'claude-opus-5-5'
        modelLabel: 'Claude Opus 5.5'
        thinking: true
        effort: medium
    - name: 'time-fable'
      label: 'Claude Fable 5.2'
      description: 'پلن نامحدود؛ Fable'
      group: 'Claude'
      iconURL: 'anthropic'
      timePack: true
      preset:
        endpoint: 'ClaudeTime'
        model: 'claude-fable-5-2'
        modelLabel: 'Claude Fable 5.2'
        thinking: true
        effort: high
    - name: 'time-mythos'
      label: 'Claude Mythos 5.2'
      description: 'پلن نامحدود؛ Mythos'
      group: 'Claude'
      iconURL: 'anthropic'
      timePack: true
      preset:
        endpoint: 'ClaudeTime'
        model: 'claude-mythos-5-2'
        modelLabel: 'Claude Mythos 5.2'
        thinking: true
        effort: high
    # --- ChatGPT ---
    - name: 'gpt'
      label: 'ChatGPT'
      description: 'مدل اصلی OpenAI'
      group: 'ChatGPT'
      groupIcon: 'openai'
      iconURL: 'openai'
      preset:
        endpoint: 'OpenRouter'
        model: '~openai/gpt-sol-latest'
        modelLabel: 'ChatGPT'
    - name: 'gpt-astra'
      label: 'ChatGPT Astra'
      description: 'قوی‌ترین مدل OpenAI؛ برای کارهای پیچیده و چندمرحله‌ای. گران‌ترین ChatGPT'
      group: 'ChatGPT'
      iconURL: 'openai'
      preset:
        endpoint: 'OpenRouter'
        model: '~openai/gpt-astra-latest'
        modelLabel: 'ChatGPT Astra'
    - name: 'gpt-mini'
      label: 'ChatGPT Mini'
      description: 'سریع و کم‌هزینه'
      group: 'ChatGPT'
      iconURL: 'openai'
      preset:
        endpoint: 'OpenRouter'
        model: '~openai/gpt-luna-latest'
        modelLabel: 'ChatGPT Mini'
    # --- DeepSeek ---
    - name: 'deepseek-pro'
      label: 'DeepSeek Pro'
      description: 'قوی و بسیار ارزان'
      group: 'DeepSeek'
      groupIcon: 'deepseek'
      iconURL: 'deepseek'
      preset:
        endpoint: 'OpenRouter'
        model: '~deepseek/deepseek-pro-latest'
        modelLabel: 'DeepSeek Pro'
    - name: 'economy'
      label: 'DeepSeek Flash'
      description: 'کم‌مصرف‌ترین گزینه برای سؤال‌های ساده'
      group: 'DeepSeek'
      iconURL: 'deepseek'
      preset:
        endpoint: 'OpenRouter'
        model: '~deepseek/deepseek-flash-latest'
        modelLabel: 'DeepSeek Flash'
    # --- Gemini ---
    - name: 'fast'
      label: 'Gemini Flash'
      description: 'سریع؛ برای کارهای روزمره، در صورت نیاز در وب جستجو می‌کند'
      group: 'Gemini'
      groupIcon: 'google'
      iconURL: 'google'
      preset:
        endpoint: 'OpenRouter'
        model: '~google/gemini-flash-latest'
        modelLabel: 'Gemini Flash'
    - name: 'gemini-pro'
      label: 'Gemini Pro'
      description: 'قوی‌ترین Gemini؛ متن‌های طولانی و تحلیل'
      group: 'Gemini'
      iconURL: 'google'
      preset:
        endpoint: 'OpenRouter'
        model: '~google/gemini-pro-latest'
        modelLabel: 'Gemini Pro'
    # --- Grok ---
    - name: 'grok'
      label: 'Grok'
      description: 'مدل xAI'
      group: 'Grok'
      groupIcon: 'xai'
      iconURL: 'xai'
      preset:
        endpoint: 'OpenRouter'
        model: '~x-ai/grok-latest'
        modelLabel: 'Grok'
    # --- GLM ---
    - name: 'glm'
      label: 'GLM'
      description: 'مدل Z.ai'
      group: 'GLM'
      groupIcon: 'zhipu'
      iconURL: 'zhipu'
      preset:
        endpoint: 'OpenRouter'
        model: '~z-ai/glm-latest'
        modelLabel: 'GLM'
    - name: 'glm-flash'
      label: 'GLM Flash'
      description: 'سریع و بسیار ارزان'
      group: 'GLM'
      iconURL: 'zhipu'
      preset:
        endpoint: 'OpenRouter'
        model: '~z-ai/glm-flash-latest'
        modelLabel: 'GLM Flash'
    # --- Qwen ---
    - name: 'qwen'
      label: 'Qwen Plus'
      description: 'مدل اصلی Qwen'
      group: 'Qwen'
      groupIcon: 'qwen'
      iconURL: 'qwen'
      preset:
        endpoint: 'OpenRouter'
        model: 'qwen/qwen3.6-plus'
        modelLabel: 'Qwen Plus'
    - name: 'qwen-coder'
      label: 'Qwen Coder'
      description: 'مخصوص برنامه‌نویسی'
      group: 'Qwen'
      iconURL: 'qwen'
      preset:
        endpoint: 'OpenRouter'
        model: 'qwen/qwen3-coder-next'
        modelLabel: 'Qwen Coder'
    # --- Perplexity ---
    - name: 'perplexity'
      label: 'Perplexity'
      description: 'جستجوی بومی Perplexity با ذکر منبع'
      group: 'Perplexity'
      groupIcon: 'perplexity'
      iconURL: 'perplexity'
      preset:
        endpoint: 'OpenRouter'
        model: 'perplexity/sonar-pro'
        modelLabel: 'Perplexity'
    # --- Tools ---
    # These two specs keep webSearch/fileSearch forced on: that is their product.
    # Ordinary chat models leave both off so «سلام» does not pay for their schemas;
    # the composer toggles still opt them in per chat (`interface.webSearch` /
    # `fileSearch` above only unlock the badges).
    - name: 'research'
      label: 'جستجو و پژوهش'
      description: 'همیشه در وب جستجو می‌کند و با ذکر منبع پاسخ می‌دهد'
      group: 'ابزارها'
      groupIcon: '/assets/tools.svg'
      iconURL: 'google'
      webSearch: true
      fileSearch: true
      preset:
        endpoint: 'OpenRouter'
        model: '~google/gemini-flash-latest'
        modelLabel: 'جستجو و پژوهش'
        promptPrefix: |
          You are a research assistant. For every question, first use the web search tool,
          then answer concisely in the user's language and cite the sources you used.
          If the user attached files, search them as well and say which file each fact came from.
    - name: 'documents'
      label: 'پرسش از فایل‌ها'
      description: 'فایل‌های خود را بارگذاری کنید و درباره‌شان بپرسید'
      group: 'ابزارها'
      iconURL: 'anthropic'
      fileSearch: true
      preset:
        endpoint: 'OpenRouter'
        model: '~anthropic/claude-sonnet-latest'
        modelLabel: 'پرسش از فایل‌ها'
        promptPrefix: |
          Answer using the user's uploaded files. Quote the relevant passage and name the file.
          If the files do not contain the answer, say so before using general knowledge.
    # --- Confidential: providers that keep no data (ZDR), and the on-server model ---
    - name: 'private-fast'
      privacy: 'private'
      label: 'Gemini — محرمانه'
      description: 'فقط سرویس‌هایی که هیچ داده‌ای نگه نمی‌دارند؛ بدون جستجوی وب و فایل'
      group: 'محرمانه'
      groupIcon: '/assets/private.svg'
      iconURL: 'google'
      hideBadgeRow: true
      preset:
        endpoint: 'OpenRouterPrivate'
        model: 'google/gemini-3.8-flash'
        modelLabel: 'Gemini — محرمانه'
    - name: 'private-smart'
      privacy: 'private'
      label: 'Claude — محرمانه'
      description: 'Claude روی سرورهایی که داده نگه نمی‌دارند؛ بدون جستجوی وب و فایل'
      group: 'محرمانه'
      iconURL: 'anthropic'
      hideBadgeRow: true
      preset:
        endpoint: 'OpenRouterPrivate'
        model: 'anthropic/claude-sonnet-5.5'
        modelLabel: 'Claude — محرمانه'
    - name: 'private-gpt'
      privacy: 'private'
      label: 'ChatGPT — محرمانه'
      description: 'ChatGPT روی سرورهایی که داده نگه نمی‌دارند؛ بدون جستجوی وب و فایل'
      group: 'محرمانه'
      iconURL: 'openai'
      hideBadgeRow: true
      preset:
        endpoint: 'OpenRouterPrivate'
        model: 'openai/gpt-6.1-sol'
        modelLabel: 'ChatGPT — محرمانه'
    - name: 'local'
      privacy: 'local'
      label: 'داخلی — کاملاً محرمانه'
      description: 'روی سرور خودمان اجرا می‌شود و هیچ داده‌ای از سرور بیرون نمی‌رود؛ کندتر و ضعیف‌تر از مدل‌های ابری'
      group: 'لوکال'
      groupIcon: '/assets/logo.svg'
      iconURL: '/assets/logo.svg'
      hideBadgeRow: true
      preset:
        endpoint: 'Local'
        model: 'hivegpt-local'
        modelLabel: 'داخلی'
    # --- Admin only (`adminOnly`): never sent to other roles, and refused for them ---
    - name: 'local-uncensored'
      privacy: 'local'
      label: 'بدون سانسور — سریع'
      description: 'Qwen 3.6 بدون سانسور روی سرور خودمان؛ جواب مستقیم، بدون مرحلهٔ فکر'
      group: 'ادمین'
      groupIcon: '/assets/admin.svg'
      iconURL: 'qwen'
      adminOnly: true
      hideBadgeRow: true
      preset:
        endpoint: 'LocalUncensored'
        model: 'hivegpt-uncensored'
        modelLabel: 'بدون سانسور'
    - name: 'local-uncensored-think'
      privacy: 'local'
      label: 'بدون سانسور — برنامه‌نویسی (فکر عمیق)'
      description: 'همان مدل، اول فکر می‌کند بعد جواب می‌دهد؛ برای کد و مسئله‌های سخت، کندتر'
      group: 'ادمین'
      iconURL: 'qwen'
      adminOnly: true
      hideBadgeRow: true
      preset:
        endpoint: 'LocalUncensoredThink'
        model: 'hivegpt-uncensored'
        modelLabel: 'بدون سانسور'
    - name: 'local-coder'
      privacy: 'local'
      label: 'کدنویسی لوکال — بدون سانسور'
      description: 'Qwen2.5-Coder ۳۲B مخصوص کد روی سرور خودمان؛ برای سوالات عمومی همان «بدون سانسور» را بزنید. اولین بار بعد از انتخاب ممکن است ده‌ها ثانیه برای بارگذاری طول بکشد'
      group: 'ادمین'
      groupIcon: '/assets/admin.svg'
      iconURL: 'qwen'
      adminOnly: true
      hideBadgeRow: true
      preset:
        endpoint: 'LocalCoder'
        model: 'hivegpt-coder'
        modelLabel: 'کدنویسی لوکال'
