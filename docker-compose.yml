# Production stack for Coolify (Git repository + "Docker Compose" build pack).
# Also runs locally: `docker compose up -d --build` with the variables from .env.coolify.example.
#
# Coolify generates every SERVICE_* value below (secrets, passwords, the public URL), so
# the only variable you must enter is OPENROUTER_KEY. Give a domain to the `api` service
# only (e.g. https://chat.example.com, no port) and leave the other services' domain
# fields empty: they are internal. See docs/saas/DEPLOY_COOLIFY.md.
#
# The upstream development compose this replaces is still available upstream; local
# development uses `npm run backend:dev` / `npm run frontend:dev` (see README).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multi
      target: api-build
      args:
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-6144}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
      rag_api:
        condition: service_started
      searxng:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      # Coolify's proxy routes a domain without a port to container port 80, so the app
      # listens there and the domain needs no `:port` (the image runs as root).
      SERVICE_URL_API: /
      HOST: 0.0.0.0
      PORT: 80
      NODE_ENV: production
      CONFIG_PATH: /app/config/librechat.saas.yaml
      DOMAIN_CLIENT: ${SERVICE_URL_API}
      DOMAIN_SERVER: ${SERVICE_URL_API}
      TRUST_PROXY: 1
      NO_INDEX: ${NO_INDEX:-true}
      APP_TITLE: ${APP_TITLE:-HiveGPT}
      CUSTOM_FOOTER: ${CUSTOM_FOOTER:-HiveGPT ممکن است اشتباه کند. اطلاعات مهم را بررسی کنید.}
      HELP_AND_FAQ_URL: ${HELP_AND_FAQ_URL:-/}

      # Model provider: the only required value.
      OPENROUTER_KEY: ${OPENROUTER_KEY:?}

      # Secrets (generated once by Coolify, then kept). Changing CREDS_KEY/IV later makes
      # stored encrypted credentials unreadable; changing JWT secrets logs everyone out.
      CREDS_KEY: ${SERVICE_HEX_64_CREDSKEY}
      CREDS_IV: ${SERVICE_HEX_32_CREDSIV}
      JWT_SECRET: ${SERVICE_HEX_64_JWTSECRET}
      JWT_REFRESH_SECRET: ${SERVICE_HEX_64_JWTREFRESH}

      # Data stores
      MONGO_URI: mongodb://${SERVICE_USER_MONGO}:${SERVICE_PASSWORD_MONGO}@mongodb:27017/LibreChat?authSource=admin
      SEARCH: 'true'
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${SERVICE_PASSWORD_64_MEILI}
      MEILI_NO_ANALYTICS: 'true'
      RAG_API_URL: http://rag_api:8000
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      # One api replica in this stack; lets the (unused) scheduler arm instead of logging an error.
      SCHEDULES_SINGLE_PROCESS: 'true'

      # Web search (SearXNG runs in this stack; Keenable reads pages without a key).
      SEARXNG_INSTANCE_URL: http://searxng:8080
      KEENABLE_API_KEY: ${KEENABLE_API_KEY:-}
      # Reranking of web results (optional; Jina preferred when both are set).
      JINA_API_KEY: ${JINA_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}

      # Accounts
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_EMAIL_LOGIN: 'true'
      # Passkeys (fingerprint / Face ID / security key). Browsers allow them only over HTTPS,
      # so set the Coolify domain to https://. The relying party is the domain of
      # SERVICE_URL_API; set PASSKEY_RP_ID before changing the domain, or saved passkeys stop working.
      ALLOW_PASSKEY_LOGIN: ${ALLOW_PASSKEY_LOGIN:-true}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-HiveGPT}
      # Social login only renders providers that are configured, so with empty OPENID_*
      # values users see the email form alone.
      ALLOW_SOCIAL_LOGIN: 'true'
      ALLOW_SOCIAL_REGISTRATION: ${ALLOW_SOCIAL_REGISTRATION:-true}
      # OpenID Connect (optional): set issuer, client id and secret to show the button.
      # Register the redirect URI <your domain>/oauth/openid/callback with the provider.
      OPENID_ISSUER: ${OPENID_ISSUER:-}
      OPENID_CLIENT_ID: ${OPENID_CLIENT_ID:-}
      OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET:-}
      OPENID_SESSION_SECRET: ${SERVICE_HEX_64_OPENIDSESSION}
      OPENID_SCOPE: ${OPENID_SCOPE:-openid profile email}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_BUTTON_LABEL: ${OPENID_BUTTON_LABEL:-}
      OPENID_IMAGE_URL: ${OPENID_IMAGE_URL:-}
      OPENID_USE_PKCE: ${OPENID_USE_PKCE:-false}
      OPENID_USERNAME_CLAIM: ${OPENID_USERNAME_CLAIM:-}
      OPENID_NAME_CLAIM: ${OPENID_NAME_CLAIM:-}
      ALLOW_UNVERIFIED_EMAIL_LOGIN: ${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
      ALLOW_PASSWORD_RESET: ${ALLOW_PASSWORD_RESET:-false}
      # Optional SMTP for verification / password reset mails
      EMAIL_SERVICE: ${EMAIL_SERVICE:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
    volumes:
      - uploads:/app/uploads
      - images:/app/client/public/images
      - logs:/app/api/logs
      - librechat-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:80/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SERVICE_USER_MONGO}
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MONGO}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${SERVICE_PASSWORD_64_MEILI}
    volumes:
      - meili-data:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d rag']
      interval: 15s
      timeout: 5s
      retries: 10

  # Embeds uploaded files for file search (RAG). Embeddings go through OpenRouter too.
  rag_api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    depends_on:
      vectordb:
        condition: service_healthy
    environment:
      RAG_PORT: 8000
      DB_HOST: vectordb
      DB_PORT: 5432
      POSTGRES_DB: rag
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      # Same secret as the API, so only LibreChat-signed requests are served.
      JWT_SECRET: ${SERVICE_HEX_64_JWTSECRET}
      EMBEDDINGS_PROVIDER: openai
      # Stronger multilingual (Persian) retrieval than -3-small. Changing the model or the
      # dimensions after files were embedded requires re-uploading them: vectors of
      # different models are not comparable.
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-openai/text-embedding-3-large}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS:-1536}
      # Send raw text, not tiktoken token ids: OpenRouter routes to non-OpenAI embedding
      # models too, and chunks (1500 chars) stay far below the 8k-token input limit.
      RAG_CHECK_EMBEDDING_CTX_LENGTH: 'False'
      RAG_OPENAI_API_KEY: ${OPENROUTER_KEY:?}
      RAG_OPENAI_BASEURL: https://openrouter.ai/api/v1
    volumes:
      - rag-uploads:/app/uploads

  # Private metasearch engine used by the web search tool; not exposed publicly.
  searxng:
    # Built (not bind-mounted) so the settings file reaches the server; see the Dockerfile.
    build:
      context: ./deploy/searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SERVICE_HEX_64_SEARXNG}
      SEARXNG_BASE_URL: http://searxng:8080/

  # Local model for the "داخلی" (fully internal) chat. CPU-only; gemma3:4b needs about
  # 4 GB RAM while loaded and is unloaded after LOCAL_MODEL_KEEP_ALIVE of inactivity.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${LOCAL_MODEL}"
        wait
    environment:
      LOCAL_MODEL: ${LOCAL_MODEL:-gemma3:4b}
      OLLAMA_KEEP_ALIVE: ${LOCAL_MODEL_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${LOCAL_MODEL_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: ${LOCAL_MODEL_CPUS:-2}
          memory: ${LOCAL_MODEL_MEMORY:-6g}

volumes:
  ollama-models:
  uploads:
  images:
  logs:
  librechat-data:
  mongodb-data:
  meili-data:
  pgvector-data:
  rag-uploads:
